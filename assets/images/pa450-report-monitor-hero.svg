<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">PA450 Report CSV Monitor Hero</title>
  <desc id="desc">Dark hero diagram showing PA450 custom report automation, CSV conversion, AI analysis, and review UI feedback memory.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0f1f3b"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="520" fill="url(#bg)" rx="36"/>
  <circle cx="1040" cy="88" r="160" fill="#38bdf8" opacity="0.08"/>
  <circle cx="130" cy="430" r="210" fill="#22c55e" opacity="0.07"/>
  <text x="80" y="105" fill="#e0f2fe" font-family="Segoe UI, Noto Sans TC, Arial" font-size="46" font-weight="800">PA450 Report CSV Monitor</text>
  <text x="82" y="148" fill="#a7c7e7" font-family="Segoe UI, Noto Sans TC, Arial" font-size="22">Download custom reports, convert CSV, analyze with AI, and collect review feedback.</text>
  <g filter="url(#shadow)">
    <rect x="80" y="210" width="210" height="135" rx="22" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <text x="185" y="262" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI, Noto Sans TC, Arial" font-size="22" font-weight="700">PA450</text>
    <text x="185" y="294" text-anchor="middle" fill="#93c5fd" font-family="Segoe UI, Noto Sans TC, Arial" font-size="16">Custom Report</text>
    <text x="185" y="320" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, Noto Sans TC, Arial" font-size="14">API XML</text>

    <rect x="370" y="210" width="210" height="135" rx="22" fill="#0f172a" stroke="#22c55e" stroke-width="2"/>
    <text x="475" y="262" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI, Noto Sans TC, Arial" font-size="22" font-weight="700">CSV</text>
    <text x="475" y="294" text-anchor="middle" fill="#86efac" font-family="Segoe UI, Noto Sans TC, Arial" font-size="16">YYYYMMDD_report.csv</text>
    <text x="475" y="320" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, Noto Sans TC, Arial" font-size="14">含目的地國家</text>

    <rect x="660" y="210" width="210" height="135" rx="22" fill="#0f172a" stroke="#a78bfa" stroke-width="2"/>
    <text x="765" y="262" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI, Noto Sans TC, Arial" font-size="22" font-weight="700">AI Analysis</text>
    <text x="765" y="294" text-anchor="middle" fill="#c4b5fd" font-family="Segoe UI, Noto Sans TC, Arial" font-size="16">report_YYYYMMDD.json</text>
    <text x="765" y="320" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, Noto Sans TC, Arial" font-size="14">Review rules</text>

    <rect x="950" y="210" width="170" height="135" rx="22" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
    <text x="1035" y="262" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI, Noto Sans TC, Arial" font-size="22" font-weight="700">Review UI</text>
    <text x="1035" y="294" text-anchor="middle" fill="#fcd34d" font-family="Segoe UI, Noto Sans TC, Arial" font-size="16">Feedback</text>
    <text x="1035" y="320" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, Noto Sans TC, Arial" font-size="14">report_YYYYMMDD.md</text>
  </g>
  <g stroke="url(#accent)" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M296 278 H364"/>
    <path d="M586 278 H654"/>
    <path d="M876 278 H944"/>
  </g>
  <g fill="url(#accent)">
    <path d="M354 266 L374 278 L354 290 Z"/>
    <path d="M644 266 L664 278 L644 290 Z"/>
    <path d="M934 266 L954 278 L934 290 Z"/>
  </g>
  <rect x="80" y="390" width="1040" height="62" rx="18" fill="#020617" opacity="0.62" stroke="#334155"/>
  <text x="100" y="428" fill="#cbd5e1" font-family="Segoe UI, Noto Sans TC, Arial" font-size="18">Windows-first workflow · PowerShell commands · Local review memory · No fixed bytes threshold</text>
</svg>
