<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">PA450 Report CSV Monitor</title>
  <desc id="desc">A cover-like README hero for PA450 Report CSV Monitor, using abstract security radar, data ribbons, and polished editorial typography.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06101e"/>
      <stop offset="0.52" stop-color="#0b1833"/>
      <stop offset="1" stop-color="#1c245f"/>
    </linearGradient>
    <radialGradient id="aura-blue" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.42"/>
      <stop offset="0.58" stop-color="#2563eb" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aura-green" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="0.22" stop-color="#38bdf8" stop-opacity="0.86"/>
      <stop offset="0.58" stop-color="#22c55e" stop-opacity="0.82"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <filter id="soft" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="20" flood-color="#020617" flood-opacity="0.50"/>
    </filter>
  </defs>

  <rect width="1200" height="520" rx="36" fill="url(#bg)"/>
  <circle cx="925" cy="205" r="260" fill="url(#aura-blue)" filter="url(#soft)"/>
  <circle cx="196" cy="430" r="236" fill="url(#aura-green)" filter="url(#soft)"/>
  <path d="M0 394 C174 322 307 360 480 278 C664 190 844 134 1200 156 L1200 520 L0 520 Z" fill="#ffffff" opacity="0.035"/>

  <g opacity="0.18" stroke="#7dd3fc" stroke-width="1" fill="none">
    <path d="M750 72 H1108"/>
    <path d="M750 118 H1108"/>
    <path d="M750 164 H1108"/>
    <path d="M750 210 H1108"/>
    <path d="M750 256 H1108"/>
    <path d="M750 302 H1108"/>
    <path d="M796 40 V336"/>
    <path d="M842 40 V336"/>
    <path d="M888 40 V336"/>
    <path d="M934 40 V336"/>
    <path d="M980 40 V336"/>
    <path d="M1026 40 V336"/>
    <path d="M1072 40 V336"/>
  </g>

  <g transform="translate(914 205)" opacity="0.84">
    <circle r="142" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.42"/>
    <circle r="100" fill="none" stroke="#22c55e" stroke-width="2" opacity="0.34"/>
    <circle r="56" fill="none" stroke="#a78bfa" stroke-width="2" opacity="0.38"/>
    <path d="M0 0 L96 -98" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.80"/>
    <path d="M0 -142 V142 M-142 0 H142" stroke="#94a3b8" stroke-width="1" opacity="0.28"/>
    <circle cx="96" cy="-98" r="8" fill="#38bdf8"/>
    <circle cx="-48" cy="64" r="6" fill="#22c55e"/>
    <circle cx="54" cy="82" r="5" fill="#a78bfa"/>
  </g>

  <path d="M82 366 C212 304 324 408 454 332 C566 266 650 292 760 236 C844 192 918 214 1054 156" stroke="url(#ribbon)" stroke-width="15" fill="none" stroke-linecap="round" opacity="0.82"/>
  <path d="M120 408 C246 352 350 436 486 366 C620 296 714 334 828 278 C910 238 980 252 1112 208" stroke="url(#ribbon)" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.46"/>

  <g font-family="WenQuanYi Zen Hei, Microsoft JhengHei, Noto Sans TC, Segoe UI, Arial, sans-serif">
    <g transform="translate(82 86)">
      <text x="0" y="0" fill="#eaf6ff" font-size="58" font-weight="900" letter-spacing="0.2">PA450</text>
      <text x="0" y="64" fill="#eaf6ff" font-size="58" font-weight="900" letter-spacing="0.2">Report Monitor</text>
      <rect x="2" y="88" width="416" height="4" rx="2" fill="url(#ribbon)"/>
      <text x="2" y="128" fill="#a9c4e6" font-size="21">本機每日報表 · CSV 留存 · AI 分析 · 人工回饋記憶</text>
      <text x="2" y="160" fill="#7487a4" font-size="15" letter-spacing="1.4">PAN-OS XML API / LOCAL REVIEW UI / BYTES-AWARE CSV</text>
    </g>

    <g transform="translate(84 326)" filter="url(#shadow)">
      <rect width="428" height="92" rx="24" fill="#101d34" opacity="0.92" stroke="#34506f"/>
      <text x="30" y="38" fill="#f8fafc" font-size="18" font-weight="900">Daily intelligence pack</text>
      <text x="30" y="66" fill="#c7d2e3" font-size="15">CSV 留存 · JSON 分析 · feedback memory</text>
    </g>

    <g transform="translate(700 382)">
      <rect width="410" height="64" rx="20" fill="#020617" opacity="0.62" stroke="#334155"/>
      <text x="28" y="27" fill="#e2e8f0" font-size="14" font-weight="800">LOCAL-FIRST REVIEW</text>
      <text x="28" y="47" fill="#94a3b8" font-size="13">Windows localhost UI for daily PA450 reports</text>
    </g>
  </g>
</svg>
