<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">PA450 Report Monitor poster</title>
  <desc id="desc">A poster-like README hero for PA450 Report Monitor: moody security radar, glowing network terrain, and minimal project title text.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.45" stop-color="#06213a"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.75"/>
      <stop offset="0.42" stop-color="#0ea5e9" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowAmber" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="horizon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0.05"/>
      <stop offset="0.28" stop-color="#22c55e" stop-opacity="0.82"/>
      <stop offset="0.62" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0.1"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#7dd3fc" stroke-opacity="0.07"/>
    </pattern>
    <filter id="blur" x="-45%" y="-45%" width="190%" height="190%"><feGaussianBlur stdDeviation="34"/></filter>
    <filter id="shadow" x="-35%" y="-35%" width="170%" height="170%"><feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#020617" flood-opacity="0.62"/></filter>
  </defs>
  <rect width="1200" height="520" rx="36" fill="url(#bg)"/>
  <rect x="26" y="26" width="1148" height="468" rx="30" fill="url(#grid)"/>
  <circle cx="850" cy="198" r="310" fill="url(#glowCyan)" filter="url(#blur)"/>
  <circle cx="332" cy="402" r="280" fill="url(#glowAmber)" filter="url(#blur)"/>
  <path d="M0 398 C140 346 262 384 420 318 C594 245 756 244 950 178 C1050 144 1132 126 1200 100 L1200 520 L0 520 Z" fill="#ffffff" opacity="0.045"/>

  <g transform="translate(800 214)" filter="url(#shadow)">
    <circle r="156" fill="#03111f" opacity="0.72" stroke="#38bdf8" stroke-width="2"/>
    <circle r="112" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.46"/>
    <circle r="72" fill="none" stroke="#22c55e" stroke-width="2" opacity="0.38"/>
    <circle r="30" fill="#071a2f" stroke="#bae6fd" stroke-width="2" opacity="0.9"/>
    <path d="M0 0 L112 -96" stroke="#7dd3fc" stroke-width="5" stroke-linecap="round"/>
    <circle cx="112" cy="-96" r="10" fill="#7dd3fc"/>
    <path d="M0 -156V156 M-156 0H156" stroke="#94a3b8" stroke-opacity="0.28"/>
    <path d="M-102 76 C-60 28 -16 38 22 8 C68 -28 98 -12 132 -46" fill="none" stroke="#22c55e" stroke-width="4" stroke-linecap="round" opacity="0.72"/>
    <circle cx="-102" cy="76" r="7" fill="#22c55e"/><circle cx="22" cy="8" r="6" fill="#22c55e"/><circle cx="132" cy="-46" r="7" fill="#f59e0b"/>
  </g>

  <path d="M70 360 C210 306 326 374 478 304 C638 230 760 262 904 198 C1004 154 1086 156 1160 118" stroke="url(#horizon)" stroke-width="20" fill="none" stroke-linecap="round" opacity="0.92"/>
  <path d="M112 414 C246 354 370 422 514 356 C666 286 800 326 936 260 C1020 220 1080 220 1142 194" stroke="url(#horizon)" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.58"/>

  <g font-family="WenQuanYi Zen Hei, Microsoft JhengHei, Noto Sans TC, Segoe UI, Arial, sans-serif">
    <g transform="translate(82 88)">
      <text x="0" y="0" fill="#f8fafc" font-size="76" font-weight="900" letter-spacing="-1.2">PA450</text>
      <text x="0" y="76" fill="#f8fafc" font-size="76" font-weight="900" letter-spacing="-1.2">REPORT</text>
      <text x="4" y="118" fill="#7dd3fc" font-size="26" font-weight="800" letter-spacing="6">MONITOR</text>
      <rect x="4" y="145" width="332" height="7" rx="4" fill="url(#horizon)"/>
      <text x="4" y="196" fill="#cbd5e1" font-size="20">Local evidence. Human review. Safer rules.</text>
    </g>
    <g transform="translate(84 428)">
      <text x="0" y="0" fill="#718096" font-size="13" letter-spacing="2.2">PAN-OS XML API · CSV · AI JSON · REVIEW MEMORY</text>
    </g>
  </g>
</svg>
