<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">PA450 Report CSV Monitor</title>
  <desc id="desc">README hero for PA450 Report CSV Monitor showing a local-first PA450 report pipeline, review memory, and a radar-style monitoring visual.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06101e"/>
      <stop offset="0.55" stop-color="#0a1730"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <radialGradient id="blueGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.38"/>
      <stop offset="0.58" stop-color="#2563eb" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="greenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="0.20" stop-color="#38bdf8" stop-opacity="0.92"/>
      <stop offset="0.52" stop-color="#22c55e" stop-opacity="0.88"/>
      <stop offset="0.82" stop-color="#60a5fa" stop-opacity="0.84"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15243d" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#0b1426" stop-opacity="0.96"/>
    </linearGradient>
    <filter id="blur" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020617" flood-opacity="0.48"/>
    </filter>
  </defs>

  <rect width="1200" height="520" rx="36" fill="url(#bg)"/>
  <circle cx="890" cy="182" r="238" fill="url(#blueGlow)" filter="url(#blur)"/>
  <circle cx="210" cy="444" r="260" fill="url(#greenGlow)" filter="url(#blur)"/>
  <path d="M0 382 C178 316 318 354 472 278 C636 198 826 150 1200 166 L1200 520 L0 520 Z" fill="#ffffff" opacity="0.035"/>

  <g opacity="0.16" stroke="#7dd3fc" stroke-width="1" fill="none">
    <path d="M742 58 H1110"/>
    <path d="M742 104 H1110"/>
    <path d="M742 150 H1110"/>
    <path d="M742 196 H1110"/>
    <path d="M742 242 H1110"/>
    <path d="M742 288 H1110"/>
    <path d="M788 34 V318"/>
    <path d="M834 34 V318"/>
    <path d="M880 34 V318"/>
    <path d="M926 34 V318"/>
    <path d="M972 34 V318"/>
    <path d="M1018 34 V318"/>
    <path d="M1064 34 V318"/>
  </g>

  <g transform="translate(906 190)" opacity="0.92">
    <circle r="136" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.42"/>
    <circle r="96" fill="none" stroke="#22c55e" stroke-width="2" opacity="0.34"/>
    <circle r="52" fill="none" stroke="#94a3b8" stroke-width="2" opacity="0.28"/>
    <path d="M0 0 L92 -90" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <path d="M0 -136 V136 M-136 0 H136" stroke="#94a3b8" stroke-width="1" opacity="0.26"/>
    <circle cx="92" cy="-90" r="8" fill="#38bdf8"/>
    <circle cx="-48" cy="62" r="6" fill="#22c55e"/>
    <circle cx="58" cy="78" r="5" fill="#60a5fa"/>
  </g>

  <path d="M78 366 C218 302 328 404 466 328 C582 264 668 292 784 236 C872 192 944 212 1068 154" stroke="url(#flow)" stroke-width="14" fill="none" stroke-linecap="round" opacity="0.82"/>
  <path d="M112 408 C242 354 352 432 492 366 C628 302 736 330 846 278 C930 238 998 252 1114 208" stroke="url(#flow)" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.42"/>

  <g font-family="WenQuanYi Zen Hei, Microsoft JhengHei, Noto Sans TC, Segoe UI, Arial, sans-serif">
    <g transform="translate(82 82)">
      <text x="0" y="0" fill="#f1f7ff" font-size="60" font-weight="900" letter-spacing="0.2">PA450</text>
      <text x="0" y="66" fill="#f1f7ff" font-size="60" font-weight="900" letter-spacing="0.2">Report Monitor</text>
      <rect x="2" y="90" width="400" height="4" rx="2" fill="url(#flow)"/>
      <text x="2" y="130" fill="#bdd3ef" font-size="21">每日 CSV 留存、AI 分析、人工回饋記憶</text>
      <text x="2" y="162" fill="#7f93b3" font-size="14" letter-spacing="1.6">PAN-OS XML API / LOCAL REVIEW UI / REVIEW RULES</text>
    </g>

    <g transform="translate(84 322)" filter="url(#shadow)">
      <rect width="430" height="96" rx="24" fill="url(#panel)" stroke="#365a7d"/>
      <text x="30" y="38" fill="#f8fafc" font-size="18" font-weight="900">Daily evidence pack</text>
      <text x="30" y="66" fill="#cbd7e9" font-size="15">YYYYMMDD_report.csv · report_YYYYMMDD.json</text>
    </g>

    <g transform="translate(700 374)" filter="url(#shadow)">
      <rect width="412" height="72" rx="20" fill="#06101e" opacity="0.78" stroke="#334155"/>
      <text x="28" y="31" fill="#e2e8f0" font-size="14" font-weight="900">LOCAL-FIRST REVIEW</text>
      <text x="28" y="52" fill="#98aac4" font-size="13">Feedback becomes .agent/review.md rules</text>
    </g>
  </g>
</svg>
