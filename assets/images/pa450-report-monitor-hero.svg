<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">PA450 Report Monitor cinematic README hero</title>
  <desc id="desc">A refined poster-style README hero with a cinematic amber spotlight, oversized PA450 typography, firewall silhouette, and restrained technical marks.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080a12"/>
      <stop offset="0.54" stop-color="#101521"/>
      <stop offset="1" stop-color="#211407"/>
    </linearGradient>
    <radialGradient id="spot" cx="73%" cy="45%" r="58%">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.54"/>
      <stop offset="0.28" stop-color="#d97706" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#0b1020" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="green" cx="21%" cy="68%" r="56%">
      <stop offset="0" stop-color="#16a34a" stop-opacity="0.36"/>
      <stop offset="0.34" stop-color="#16a34a" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#16a34a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0"/>
      <stop offset="0.28" stop-color="#22c55e"/>
      <stop offset="0.62" stop-color="#facc15"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-30%" width="150%" height="170%"><feDropShadow dx="0" dy="28" stdDeviation="24" flood-color="#000" flood-opacity="0.50"/></filter>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#f8fafc" stroke-opacity="0.035"/></pattern>
    <style>
      .display{font-family:'WenQuanYi Zen Hei','Arial Black',Impact,sans-serif;font-weight:900;letter-spacing:-7px;fill:#f8fafc}
      .mono{font-family:'JetBrains Mono',Consolas,monospace;fill:#d1d5db}
      .sans{font-family:'WenQuanYi Zen Hei',Inter,Arial,sans-serif;fill:#e5e7eb}
    </style>
  </defs>
  <rect width="1200" height="520" rx="34" fill="url(#bg)"/>
  <rect width="1200" height="520" rx="34" fill="url(#spot)"/>
  <rect width="1200" height="520" rx="34" fill="url(#green)"/>
  <rect width="1200" height="520" rx="34" fill="url(#grid)"/>

  <g opacity="0.55" fill="none" stroke="url(#rail)" stroke-linecap="round">
    <path d="M54 381 C199 300, 320 376, 471 300 C627 221, 762 228, 925 174 C1018 143, 1098 154, 1172 189" stroke-width="18"/>
    <path d="M86 432 C226 359, 365 421, 516 344 C674 262, 823 274, 1098 246" stroke-width="4" opacity="0.72"/>
  </g>

  <g transform="translate(642 86)" filter="url(#shadow)">
    <rect x="0" y="0" width="372" height="274" rx="30" fill="#0c111d" stroke="#f8fafc" stroke-opacity="0.12"/>
    <rect x="28" y="31" width="316" height="64" rx="18" fill="#151c2b" stroke="#475569" stroke-opacity="0.55"/>
    <text x="52" y="71" class="mono" font-size="20" font-weight="900" letter-spacing="3" fill="#f8fafc">PA-450</text>
    <text x="202" y="70" class="mono" font-size="12" letter-spacing="2" fill="#94a3b8">XML API</text>
    <g transform="translate(38 128)">
      <rect width="50" height="18" rx="5" fill="#22c55e"/><rect x="66" width="50" height="18" rx="5" fill="#84cc16" opacity="0.75"/><rect x="132" width="50" height="18" rx="5" fill="#f59e0b"/><rect x="198" width="50" height="18" rx="5" fill="#fb923c" opacity="0.85"/><rect x="264" width="50" height="18" rx="5" fill="#64748b"/>
    </g>
    <path d="M42 188H330M42 223H330" stroke="#334155" stroke-width="1"/>
    <text x="43" y="211" class="mono" font-size="13" fill="#cbd5e1">CSV evidence  /  AI JSON  /  review.md</text>
    <text x="43" y="246" class="mono" font-size="12" fill="#94a3b8">local files first · auditable changes</text>
  </g>

  <text x="70" y="92" class="mono" font-size="13" font-weight="800" letter-spacing="5" fill="#a3e635">PAN-OS CUSTOM REPORT AUTOMATION</text>
  <text x="66" y="218" class="display" font-size="122">PA450</text>
  <text x="70" y="319" class="display" font-size="100" letter-spacing="-5">REPORT</text>
  <text x="76" y="369" class="mono" font-size="30" font-weight="900" letter-spacing="12" fill="#facc15">MONITOR</text>
  <rect x="76" y="391" width="422" height="6" rx="3" fill="url(#rail)"/>
  <text x="77" y="438" class="sans" font-size="22" font-weight="700">Download evidence. Review decisions. Improve the next run.</text>
  <text x="78" y="466" class="mono" font-size="12" letter-spacing="2" fill="#9ca3af">README HERO · STATIC SVG · NO RUNTIME SIDE EFFECTS</text>

  <text x="1050" y="455" class="display" font-size="180" opacity="0.045">450</text>
  <rect x="18" y="18" width="1164" height="484" rx="28" fill="none" stroke="#ffffff" stroke-opacity="0.10"/>
</svg>
