<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">PA450 Report CSV Monitor hero</title>
  <desc id="desc">A product-launch style README cover showing PA450 reports flowing into CSV, AI JSON, and review memory.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071413"/>
      <stop offset="0.46" stop-color="#0c211d"/>
      <stop offset="1" stop-color="#f3ead8"/>
    </linearGradient>
    <radialGradient id="spot" cx="74%" cy="42%" r="55%">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.78"/>
      <stop offset="0.36" stop-color="#22c55e" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#071413" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="0.55" stop-color="#84cc16"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#020617" flood-opacity="0.34"/>
    </filter>
    <filter id="cardShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#000000" flood-opacity="0.26"/>
    </filter>
    <clipPath id="round"><rect width="1200" height="520" rx="36"/></clipPath>
    <style>
      .display{font-family:Inter,Segoe UI,Arial,sans-serif;font-weight:900;letter-spacing:-5px;fill:#f8fafc}
      .eyebrow{font-family:'JetBrains Mono','Cascadia Mono',Consolas,monospace;font-size:15px;font-weight:800;letter-spacing:4px;text-transform:uppercase;fill:#9be7c5}
      .body{font-family:Inter,Segoe UI,Arial,sans-serif;font-weight:800;fill:#dbe7df}
      .muted{font-family:Inter,Segoe UI,Arial,sans-serif;font-weight:700;fill:#8ea39a}
      .mono{font-family:'JetBrains Mono','Cascadia Mono',Consolas,monospace;font-weight:800}
    </style>
  </defs>
  <g clip-path="url(#round)">
    <rect width="1200" height="520" fill="url(#bg)"/>
    <rect width="1200" height="520" fill="url(#grid)"/>
    <rect width="1200" height="520" fill="url(#spot)"/>
    <path d="M768 -20 C910 48 1002 154 1220 126" fill="none" stroke="#f59e0b" stroke-opacity="0.44" stroke-width="3"/>
    <path d="M790 540 C944 442 1054 410 1228 438" fill="none" stroke="#22c55e" stroke-opacity="0.28" stroke-width="3"/>
    <circle cx="887" cy="265" r="192" fill="none" stroke="#f7e7bf" stroke-opacity="0.15"/>
    <circle cx="887" cy="265" r="124" fill="none" stroke="#f7e7bf" stroke-opacity="0.10"/>

    <g transform="translate(76 70)">
      <text class="eyebrow" x="0" y="0">PA450 / PAN-OS XML API / LOCAL REVIEW MEMORY</text>
      <rect x="0" y="22" width="396" height="1" fill="#ecfdf5" opacity="0.18"/>
      <text class="display" x="0" y="122" font-size="92">Report</text>
      <text class="display" x="0" y="209" font-size="92">Monitor</text>
      <rect x="2" y="240" width="410" height="8" rx="4" fill="url(#accent)"/>
      <text class="body" x="0" y="302" font-size="29">Firewall reports become</text>
      <text class="body" x="0" y="339" font-size="29">reviewed evidence.</text>
      <text class="muted" x="0" y="378" font-size="18">CSV download · AI JSON · human feedback · reusable rules</text>
    </g>

    <g transform="translate(650 118) rotate(-7)" filter="url(#soft)">
      <rect x="0" y="0" width="392" height="248" rx="28" fill="#fff8eb" stroke="#eadfc8"/>
      <text class="mono" x="34" y="52" font-size="15" fill="#5f4f37" letter-spacing="2.2">DAILY REPORT</text>
      <text class="mono" x="286" y="52" font-size="13" fill="#7c6a4d">YYYYMMDD</text>
      <line x1="34" y1="84" x2="358" y2="84" stroke="#d7ccb6" stroke-width="2"/>
      <rect x="34" y="110" width="108" height="15" rx="7" fill="#0f766e"/>
      <rect x="160" y="106" width="170" height="15" rx="7" fill="#d3cabb"/>
      <rect x="34" y="151" width="150" height="15" rx="7" fill="#ea7b08"/>
      <rect x="208" y="147" width="136" height="15" rx="7" fill="#d3cabb"/>
      <rect x="34" y="192" width="182" height="15" rx="7" fill="#84cc16"/>
      <rect x="238" y="188" width="104" height="15" rx="7" fill="#d3cabb"/>
    </g>

    <g transform="translate(914 296) rotate(9)" filter="url(#cardShadow)">
      <rect width="154" height="122" rx="24" fill="#071413"/>
      <text class="mono" x="26" y="38" font-size="15" fill="#dffcea">.agent</text>
      <text class="body" x="25" y="72" font-size="31" fill="#ffffff">review</text>
      <rect x="28" y="88" width="88" height="9" rx="4.5" fill="#84cc16"/>
    </g>

    <g transform="translate(684 398)">
      <rect x="0" y="0" width="426" height="54" rx="27" fill="#071413" fill-opacity="0.78" stroke="#ecfdf5" stroke-opacity="0.12"/>
      <text class="mono" x="26" y="34" font-size="15" fill="#a7f3d0">custom report → CSV → AI JSON → reviewed rules</text>
    </g>

    <g transform="translate(76 474)" opacity="0.95">
      <text class="mono" x="0" y="0" font-size="13" fill="#9be7c5">01 CUSTOM REPORT</text>
      <text class="mono" x="190" y="0" font-size="13" fill="#d5f6a6">02 CSV OUTPUT</text>
      <text class="mono" x="360" y="0" font-size="13" fill="#fed7aa">03 AI REVIEW</text>
      <text class="mono" x="515" y="0" font-size="13" fill="#f8fafc">04 MEMORY LOOP</text>
    </g>
  </g>
</svg>
