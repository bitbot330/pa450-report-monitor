      <rect x="135" width="106" height="84" rx="20" fill="#fff7ed"/><text x="152" y="31" class="mono" font-size="11" font-weight="900" fill="#92400e">AI JSON</text><path d="M152 55H221" stroke="#f59e0b" stroke-width="9" stroke-linecap="round"/><path d="M152 72H202" stroke="#fb923c" stroke-width="6" stroke-linecap="round"/>
      <rect x="270" width="106" height="84" rx="20" fill="#eff6ff"/><text x="287" y="31" class="mono" font-size="11" font-weight="900" fill="#1d4ed8">REVIEW</text><path d="M287 55H356" stroke="#2563eb" stroke-width="9" stroke-linecap="round"/><path d="M287 72H337" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
