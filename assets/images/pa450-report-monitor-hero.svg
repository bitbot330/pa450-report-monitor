<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">PA450 Report Monitor premium evidence cover</title>
  <desc id="desc">A premium README cover for PA450 Report Monitor: a restrained editorial evidence lens, layered report sheets, and strong typography for local PA450 custom report analysis.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f1e3"/>
      <stop offset="0.55" stop-color="#eee3cf"/>
      <stop offset="1" stop-color="#d9cfba"/>
    </linearGradient>
    <radialGradient id="warm" cx="78%" cy="28%" r="58%">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.34"/>
      <stop offset="0.42" stop-color="#d97706" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cool" cx="58%" cy="74%" r="54%">
      <stop offset="0" stop-color="#0f766e" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#0f766e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101a17"/><stop offset="1" stop-color="#26342d"/></linearGradient>
    <linearGradient id="sheet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffaf0"/><stop offset="1" stop-color="#e7dcc8"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0f766e"/><stop offset="0.55" stop-color="#84cc16"/><stop offset="1" stop-color="#d97706"/></linearGradient>
    <pattern id="grain" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.7" fill="#101a17" opacity="0.055"/><circle cx="5" cy="4" r="0.45" fill="#101a17" opacity="0.04"/></pattern>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" fill="none" stroke="#101a17" stroke-opacity="0.045"/></pattern>
    <filter id="deep" x="-20%" y="-25%" width="145%" height="160%"><feDropShadow dx="0" dy="34" stdDeviation="24" flood-color="#101a17" flood-opacity="0.28"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
    <style>
      .display{font-family:Inter,Segoe UI,Arial,sans-serif;font-weight:920;letter-spacing:-5px;fill:#101a17}.sans{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#101a17}.mono{font-family:"JetBrains Mono","Cascadia Mono",Consolas,monospace;fill:#101a17}.label{font-family:"JetBrains Mono","Cascadia Mono",Consolas,monospace;font-size:12px;font-weight:850;letter-spacing:1.8px;fill:#6d6048}
    </style>
  </defs>

  <rect width="1200" height="520" rx="34" fill="url(#canvas)"/>
  <rect width="1200" height="520" rx="34" fill="url(#warm)"/>
  <rect width="1200" height="520" rx="34" fill="url(#cool)"/>
  <rect width="1200" height="520" rx="34" fill="url(#grid)"/>
  <rect width="1200" height="520" rx="34" fill="url(#grain)"/>

  <path d="M60 60H1140M60 460H1140M88 88V432M1112 88V432" stroke="#101a17" stroke-opacity="0.13"/>
  <text x="84" y="43" class="label">PA450 / PAN-OS XML API / LOCAL REVIEW MEMORY</text>
  <text x="1034" y="43" class="label">README COVER</text>

  <!-- left editorial title -->
  <g transform="translate(86 108)">
    <text x="0" y="78" class="display" font-size="94">PA450</text>
    <text x="0" y="151" class="display" font-size="78">Report</text>
    <text x="0" y="224" class="display" font-size="78">Monitor</text>
    <rect x="4" y="246" width="276" height="5" rx="3" fill="url(#accent)"/>
    <text x="5" y="292" class="sans" font-size="23" font-weight="760">Firewall reports become reviewed evidence.</text>
    <text x="5" y="324" class="sans" font-size="17" font-weight="560" style="fill:#4e594f">Download CSV, analyze JSON, and preserve human feedback as reusable local rules.</text>
  </g>

  <!-- large evidence lens / product mark -->
  <g transform="translate(604 76)">
    <circle cx="248" cy="186" r="172" fill="none" stroke="#101a17" stroke-opacity="0.16" stroke-width="1.4"/>
    <circle cx="248" cy="186" r="126" fill="none" stroke="#101a17" stroke-opacity="0.10" stroke-width="1.2"/>
    <path d="M80 186H416M248 18V354" stroke="#101a17" stroke-opacity="0.10"/>
    <path d="M122 72C202 128 292 246 374 302" fill="none" stroke="#d97706" stroke-opacity="0.42" stroke-width="3"/>
    <path d="M120 302C196 244 306 128 376 72" fill="none" stroke="#0f766e" stroke-opacity="0.40" stroke-width="3"/>
    <circle cx="248" cy="186" r="78" fill="url(#ink)" filter="url(#deep)"/>
    <text x="248" y="176" class="sans" text-anchor="middle" font-size="36" font-weight="920" style="fill:#fffaf0">CSV</text>
    <text x="248" y="207" class="mono" text-anchor="middle" font-size="12" font-weight="850" style="fill:#dcebd5">TO REVIEW RULES</text>
  </g>

  <!-- layered report sheets -->
  <g transform="translate(662 144) rotate(-8 180 130)" filter="url(#deep)">
    <rect x="28" y="22" width="340" height="214" rx="22" fill="#101a17" opacity="0.16"/>
    <rect x="12" y="10" width="340" height="214" rx="22" fill="url(#sheet)" stroke="#101a17" stroke-opacity="0.13"/>
    <text x="42" y="51" class="label">DAILY REPORT</text>
    <text x="264" y="51" class="mono" font-size="12" font-weight="800" style="fill:#6d6048">YYYYMMDD</text>
    <path d="M42 80H314M42 121H314M42 162H314" stroke="#101a17" stroke-opacity="0.13"/>
    <rect x="42" y="94" width="74" height="13" rx="7" fill="#0f766e" opacity="0.85"/>
    <rect x="132" y="94" width="142" height="13" rx="7" fill="#101a17" opacity="0.14"/>
    <rect x="42" y="135" width="102" height="13" rx="7" fill="#d97706" opacity="0.85"/>
    <rect x="160" y="135" width="114" height="13" rx="7" fill="#101a17" opacity="0.14"/>
    <rect x="42" y="176" width="126" height="13" rx="7" fill="#84cc16" opacity="0.88"/>
    <rect x="184" y="176" width="90" height="13" rx="7" fill="#101a17" opacity="0.14"/>
  </g>

  <g transform="translate(956 298) rotate(10)" filter="url(#deep)">
    <rect width="132" height="106" rx="18" fill="#101a17"/>
    <text x="66" y="39" class="mono" text-anchor="middle" font-size="12" font-weight="900" style="fill:#f8f1e3">.agent</text>
    <text x="66" y="63" class="sans" text-anchor="middle" font-size="22" font-weight="920" style="fill:#f8f1e3">review</text>
    <rect x="32" y="76" width="68" height="6" rx="3" fill="#84cc16"/>
  </g>

  <!-- bottom metadata rhythm -->
  <g transform="translate(86 460)">
    <text class="mono" font-size="12" font-weight="780" opacity="0.58">01 CUSTOM REPORT</text>
    <text x="184" class="mono" font-size="12" font-weight="780" opacity="0.58">02 CSV OUTPUT</text>
    <text x="348" class="mono" font-size="12" font-weight="780" opacity="0.58">03 AI JSON</text>
    <text x="484" class="mono" font-size="12" font-weight="780" opacity="0.58">04 HUMAN REVIEW MEMORY</text>
  </g>
</svg>
