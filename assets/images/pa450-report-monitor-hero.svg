<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">PA450 Report CSV Monitor</title>
  <desc id="desc">A high-contrast README hero showing PA450 custom report automation from PAN-OS XML API to CSV, AI analysis, Local Review UI, and reusable review rules.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.48" stop-color="#071a2f"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.58"/>
      <stop offset="0.55" stop-color="#2563eb" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="greenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="0.45" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10233f" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#061121" stop-opacity="0.96"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="34"/></filter>
    <filter id="shadow" x="-35%" y="-35%" width="170%" height="170%">
      <feDropShadow dx="0" dy="22" stdDeviation="20" flood-color="#020617" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1200" height="520" rx="36" fill="url(#bg)"/>
  <circle cx="904" cy="172" r="292" fill="url(#cyanGlow)" filter="url(#soft)"/>
  <circle cx="118" cy="468" r="250" fill="url(#greenGlow)" filter="url(#soft)"/>
  <path d="M0 386 C120 338 252 344 402 298 C568 246 672 166 846 172 C990 178 1084 224 1200 194 L1200 520 L0 520 Z" fill="#ffffff" opacity="0.045"/>

  <g opacity="0.22" stroke="#7dd3fc" stroke-width="1" fill="none">
    <path d="M700 64 H1120 M700 112 H1120 M700 160 H1120 M700 208 H1120 M700 256 H1120 M700 304 H1120"/>
    <path d="M748 38 V330 M796 38 V330 M844 38 V330 M892 38 V330 M940 38 V330 M988 38 V330 M1036 38 V330 M1084 38 V330"/>
  </g>

  <g transform="translate(906 186)" filter="url(#shadow)">
    <path d="M0 -116 C54 -94 92 -88 124 -80 V12 C124 86 72 132 0 154 C-72 132 -124 86 -124 12 V-80 C-92 -88 -54 -94 0 -116Z" fill="#061527" stroke="#38bdf8" stroke-width="3" opacity="0.94"/>
    <circle r="92" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.48"/>
    <circle r="58" fill="none" stroke="#22c55e" stroke-width="2" opacity="0.44"/>
    <path d="M0 0 L76 -72" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
    <circle cx="76" cy="-72" r="9" fill="#38bdf8"/>
    <circle cx="-34" cy="48" r="7" fill="#22c55e"/>
    <circle cx="52" cy="64" r="6" fill="#a78bfa"/>
    <text x="0" y="16" text-anchor="middle" fill="#e0f2fe" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="900">CSV</text>
  </g>

  <path d="M76 330 C208 268 308 356 440 292 C566 232 668 274 786 216 C880 170 958 198 1114 132" stroke="url(#trace)" stroke-width="18" fill="none" stroke-linecap="round" opacity="0.94"/>
  <path d="M112 394 C248 330 350 410 496 342 C632 280 744 320 866 260 C948 220 1006 226 1128 184" stroke="url(#trace)" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.48"/>

  <g font-family="WenQuanYi Zen Hei, Microsoft JhengHei, Noto Sans TC, Segoe UI, Arial, sans-serif">
    <g transform="translate(82 74)">
      <text x="0" y="0" fill="#f8fafc" font-size="66" font-weight="900" letter-spacing="0.4">PA450</text>
      <text x="0" y="72" fill="#f8fafc" font-size="66" font-weight="900" letter-spacing="0.4">Report Monitor</text>
      <rect x="2" y="98" width="500" height="6" rx="3" fill="url(#trace)"/>
      <text x="2" y="142" fill="#c6d8f0" font-size="23">PAN-OS 報表下載 → 每日 CSV → AI 分析 → 人工回饋記憶</text>
      <text x="2" y="176" fill="#7f95b2" font-size="15" letter-spacing="1.8">LOCAL-FIRST · EVIDENCE CSV · REVIEW RULES</text>
    </g>

    <g transform="translate(82 338)" filter="url(#shadow)">
      <rect width="306" height="86" rx="22" fill="url(#card)" stroke="#38bdf8" stroke-opacity="0.72"/>
      <text x="28" y="36" fill="#e0f2fe" font-size="17" font-weight="900">Daily CSV evidence</text>
      <text x="28" y="62" fill="#a9bad0" font-size="13">YYYYMMDD_report.csv · 固定欄位含位元組</text>
    </g>
    <g transform="translate(426 338)" filter="url(#shadow)">
      <rect width="306" height="86" rx="22" fill="url(#card)" stroke="#a78bfa" stroke-opacity="0.72"/>
      <text x="28" y="36" fill="#ede9fe" font-size="17" font-weight="900">AI analysis output</text>
      <text x="28" y="62" fill="#a9bad0" font-size="13">report_YYYYMMDD.json · Review UI 檢視</text>
    </g>
    <g transform="translate(770 338)" filter="url(#shadow)">
      <rect width="344" height="86" rx="22" fill="url(#card)" stroke="#22c55e" stroke-opacity="0.72"/>
      <text x="28" y="36" fill="#dcfce7" font-size="17" font-weight="900">Feedback becomes rules</text>
      <text x="28" y="62" fill="#a9bad0" font-size="13">report_YYYYMMDD.md → .agent/review.md</text>
    </g>
  </g>
</svg>
