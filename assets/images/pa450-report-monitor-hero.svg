<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">PA450 Report Monitor README poster</title>
  <desc id="desc">A poster-style README hero: a dark editorial security poster with one large PA450 title, a firewall silhouette, log stream lines, and minimal supporting copy.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050712"/>
      <stop offset="0.48" stop-color="#10151f"/>
      <stop offset="1" stop-color="#17130b"/>
    </linearGradient>
    <radialGradient id="amberGlow" cx="70%" cy="48%" r="58%">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.36"/>
      <stop offset="0.38" stop-color="#f59e0b" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="greenGlow" cx="37%" cy="52%" r="52%">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0.32"/>
      <stop offset="0.4" stop-color="#22c55e" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0.05"/>
      <stop offset="0.45" stop-color="#22c55e" stop-opacity="0.9"/>
      <stop offset="0.72" stop-color="#38bdf8" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0.25"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grain" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M0 47H48M47 0V48" stroke="#ffffff" stroke-opacity="0.035"/>
      <circle cx="10" cy="13" r="0.9" fill="#fff" opacity="0.05"/>
      <circle cx="31" cy="27" r="0.7" fill="#fff" opacity="0.045"/>
      <circle cx="41" cy="7" r="0.6" fill="#fff" opacity="0.035"/>
    </pattern>
    <clipPath id="safe"><rect x="0" y="0" width="1200" height="520" rx="34"/></clipPath>
  </defs>

  <g clip-path="url(#safe)">
    <rect width="1200" height="520" fill="url(#paper)"/>
    <rect width="1200" height="520" fill="url(#amberGlow)"/>
    <rect width="1200" height="520" fill="url(#greenGlow)"/>
    <rect width="1200" height="520" fill="url(#grain)"/>

    <!-- Giant editorial background type -->
    <text x="-18" y="414" font-family="'WenQuanYi Zen Hei', Arial Black, Impact, 'Noto Sans TC', sans-serif" font-size="286" font-weight="900" letter-spacing="-15" fill="#ffffff" opacity="0.035">450</text>
    <text x="818" y="134" font-family="'WenQuanYi Zen Hei', Arial Black, Impact, 'Noto Sans TC', sans-serif" font-size="78" font-weight="900" letter-spacing="6" fill="#ffffff" opacity="0.055" transform="rotate(90 818 134)">REPORT</text>

    <!-- firewall / device silhouette -->
    <g transform="translate(674 98)" filter="url(#softShadow)">
      <rect x="0" y="0" width="360" height="260" rx="26" fill="#0b1220" stroke="#334155" stroke-opacity="0.8"/>
      <rect x="22" y="28" width="316" height="62" rx="14" fill="#111827" stroke="#475569"/>
      <text x="42" y="66" fill="#f8fafc" font-family="JetBrains Mono, Consolas, monospace" font-size="18" font-weight="800" letter-spacing="2">PA-450</text>
      <text x="184" y="66" fill="#94a3b8" font-family="JetBrains Mono, Consolas, monospace" font-size="12" letter-spacing="2">CUSTOM REPORT</text>
      <g transform="translate(36 121)">
        <rect width="42" height="16" rx="4" fill="#22c55e" opacity="0.88"/>
        <rect x="56" width="42" height="16" rx="4" fill="#22c55e" opacity="0.5"/>
        <rect x="112" width="42" height="16" rx="4" fill="#38bdf8" opacity="0.9"/>
        <rect x="168" width="42" height="16" rx="4" fill="#f59e0b" opacity="0.88"/>
        <rect x="224" width="42" height="16" rx="4" fill="#64748b" opacity="0.8"/>
      </g>
      <g stroke="#334155" stroke-width="1">
        <path d="M36 176H324"/><path d="M36 208H324"/>
      </g>
      <text x="36" y="198" fill="#94a3b8" font-family="JetBrains Mono, Consolas, monospace" font-size="12">src/report.py  →  CSV evidence</text>
      <text x="36" y="230" fill="#94a3b8" font-family="JetBrains Mono, Consolas, monospace" font-size="12">review.md     →  next AI rules</text>
    </g>

    <!-- Log stream / poster motion -->
    <g fill="none" stroke-linecap="round" filter="url(#glow)">
      <path d="M84 373 C230 322, 345 388, 503 322 S713 196, 1008 205" stroke="url(#wire)" stroke-width="20" opacity="0.66"/>
      <path d="M108 421 C265 359, 382 428, 542 362 S782 274, 1118 292" stroke="#38bdf8" stroke-width="5" opacity="0.45"/>
      <path d="M64 286 C230 256, 348 298, 478 248 S682 126, 1002 142" stroke="#22c55e" stroke-width="6" opacity="0.52"/>
    </g>
    <g>
      <circle cx="674" cy="199" r="8" fill="#22c55e"/>
      <circle cx="821" cy="149" r="8" fill="#38bdf8"/>
      <circle cx="930" cy="206" r="7" fill="#f59e0b"/>
      <circle cx="1008" cy="205" r="10" fill="#e2e8f0"/>
    </g>

    <!-- Main title block: poster, not documentation -->
    <g transform="translate(82 74)">
      <text x="0" y="0" fill="#94a3b8" font-family="JetBrains Mono, Consolas, monospace" font-size="13" font-weight="700" letter-spacing="5">PAN-OS XML API · LOCAL CSV · HUMAN REVIEW</text>
      <text x="0" y="104" fill="#f8fafc" font-family="'WenQuanYi Zen Hei', Arial Black, Impact, 'Noto Sans TC', sans-serif" font-size="106" font-weight="900" letter-spacing="-6">PA450</text>
      <text x="0" y="191" fill="#f8fafc" font-family="'WenQuanYi Zen Hei', Arial Black, Impact, 'Noto Sans TC', sans-serif" font-size="91" font-weight="900" letter-spacing="-4">REPORT</text>
      <text x="5" y="238" fill="#7dd3fc" font-family="JetBrains Mono, Consolas, monospace" font-size="28" font-weight="800" letter-spacing="13">MONITOR</text>
      <rect x="4" y="260" width="376" height="5" rx="3" fill="url(#wire)"/>
      <text x="5" y="314" fill="#dbeafe" font-family="Inter, 'Noto Sans TC', sans-serif" font-size="23" font-weight="700">Download evidence → analyze → review → improve rules.</text>
      <text x="5" y="349" fill="#94a3b8" font-family="JetBrains Mono, Consolas, monospace" font-size="14" letter-spacing="1.8">NO CLOUD DASHBOARD · NO FAKE METRICS · AUDITABLE FILES</text>
    </g>

    <rect x="18" y="18" width="1164" height="484" rx="28" fill="none" stroke="#f8fafc" stroke-opacity="0.08"/>
  </g>
</svg>
