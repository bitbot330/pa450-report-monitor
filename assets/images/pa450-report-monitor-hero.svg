<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">PA450 Report CSV Monitor</title>
  <desc id="desc">README hero showing a local evidence command center: PA450 custom reports become CSV evidence, AI analysis, Review UI feedback, and reusable review rules.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030712"/>
      <stop offset="0.48" stop-color="#082f49"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#0ea5e9" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10243d"/>
      <stop offset="1" stop-color="#07111f"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1f35"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="0.5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <pattern id="matrix" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#7dd3fc" stroke-opacity="0.08"/>
      <circle cx="0" cy="0" r="1.4" fill="#7dd3fc" opacity="0.18"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="22" stdDeviation="18" flood-color="#020617" flood-opacity="0.58"/></filter>
    <filter id="glow" x="-45%" y="-45%" width="190%" height="190%"><feGaussianBlur stdDeviation="22"/></filter>
  </defs>

  <rect width="1200" height="520" rx="36" fill="url(#bg)"/>
  <rect x="24" y="24" width="1152" height="472" rx="28" fill="url(#matrix)"/>
  <circle cx="890" cy="160" r="290" fill="url(#sun)" filter="url(#glow)"/>
  <path d="M0 418 C166 364 308 398 456 318 C640 218 818 216 1200 132 L1200 520 L0 520 Z" fill="#ffffff" opacity="0.04"/>

  <g font-family="WenQuanYi Zen Hei, Microsoft JhengHei, Noto Sans TC, Segoe UI, Arial, sans-serif">
    <g transform="translate(70 66)">
      <rect x="0" y="0" width="146" height="32" rx="16" fill="#082f49" stroke="#38bdf8" stroke-opacity="0.55"/>
      <text x="73" y="21" text-anchor="middle" fill="#bae6fd" font-size="13" font-weight="900" letter-spacing="1.3">LOCAL EVIDENCE</text>
      <text x="0" y="86" fill="#f8fafc" font-size="70" font-weight="900" letter-spacing="-0.8">PA450</text>
      <text x="0" y="158" fill="#f8fafc" font-size="70" font-weight="900" letter-spacing="-0.8">Report Monitor</text>
      <rect x="2" y="185" width="455" height="7" rx="4" fill="url(#flow)"/>
      <text x="2" y="228" fill="#d7e8f7" font-size="23" font-weight="700">Custom report → CSV 證據 → AI 分析</text>
      <text x="2" y="260" fill="#d7e8f7" font-size="23" font-weight="700">Review UI → review rules</text>
      <text x="2" y="296" fill="#8ca3bd" font-size="15">Windows 本機執行 · PAN-OS XML API · 人工回饋閉環</text>
    </g>

    <g transform="translate(660 74)" filter="url(#shadow)">
      <rect x="0" y="0" width="446" height="318" rx="28" fill="#020617" stroke="#2a4f75" stroke-width="2"/>
      <rect x="18" y="20" width="410" height="278" rx="20" fill="url(#screen)"/>
      <rect x="38" y="42" width="118" height="24" rx="12" fill="#0e7490" opacity="0.9"/>
      <text x="97" y="59" text-anchor="middle" fill="#ecfeff" font-size="12" font-weight="900">Review UI</text>
      <text x="178" y="59" fill="#94a3b8" font-size="12">report_YYYYMMDD.json</text>
      <g transform="translate(38 84)">
        <rect width="224" height="158" rx="16" fill="#06172a" stroke="#1f4f70"/>
        <text x="18" y="29" fill="#e0f2fe" font-size="14" font-weight="900">Daily CSV evidence</text>
        <g font-size="11" fill="#8fb3cc" font-family="JetBrains Mono, Consolas, monospace">
          <text x="18" y="58">time        src        app     bytes</text>
          <rect x="14" y="72" width="196" height="22" rx="8" fill="#0e293f"/>
          <text x="18" y="88" fill="#d6f3ff">09:11       10.0.1.8   ssl     8.2G</text>
          <text x="18" y="116">10:32       10.0.2.5   dns     1.4G</text>
          <text x="18" y="144">13:47       10.0.4.2   web     980M</text>
        </g>
      </g>
      <g transform="translate(286 84)">
        <rect width="116" height="158" rx="16" fill="#071b18" stroke="#1d6b52"/>
        <text x="18" y="30" fill="#dcfce7" font-size="14" font-weight="900">Rules</text>
        <path d="M20 58 H92 M20 82 H76 M20 106 H88" stroke="#86efac" stroke-width="5" stroke-linecap="round" opacity="0.75"/>
        <circle cx="26" cy="132" r="13" fill="#14532d" stroke="#22c55e"/>
        <path d="M20 132 L25 137 L34 126" stroke="#bbf7d0" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <g transform="translate(38 260)">
        <circle cx="18" cy="0" r="7" fill="#22c55e"/>
        <text x="34" y="-3" fill="#cbd5e1" font-size="12">feedback 寫入 report_YYYYMMDD.md</text>
        <text x="34" y="15" fill="#7f95b2" font-size="11">下一次分析前萃取成 .agent/review.md</text>
      </g>
    </g>

    <g transform="translate(78 414)" filter="url(#shadow)">
      <g>
        <rect width="235" height="58" rx="18" fill="url(#panel)" stroke="#22c55e"/>
        <text x="24" y="25" fill="#dcfce7" font-size="14" font-weight="900">1 · Download</text>
        <text x="24" y="43" fill="#8fb3cc" font-size="12">PA450 custom report XML</text>
      </g>
      <g transform="translate(263 0)">
        <rect width="235" height="58" rx="18" fill="url(#panel)" stroke="#38bdf8"/>
        <text x="24" y="25" fill="#e0f2fe" font-size="14" font-weight="900">2 · Preserve CSV</text>
        <text x="24" y="43" fill="#8fb3cc" font-size="12">YYYYMMDD_report.csv</text>
      </g>
      <g transform="translate(526 0)">
        <rect width="235" height="58" rx="18" fill="url(#panel)" stroke="#a78bfa"/>
        <text x="24" y="25" fill="#ede9fe" font-size="14" font-weight="900">3 · Analyze</text>
        <text x="24" y="43" fill="#8fb3cc" font-size="12">AI JSON + row detail</text>
      </g>
      <g transform="translate(789 0)">
        <rect width="235" height="58" rx="18" fill="url(#panel)" stroke="#f97316"/>
        <text x="24" y="25" fill="#fed7aa" font-size="14" font-weight="900">4 · Review loop</text>
        <text x="24" y="43" fill="#8fb3cc" font-size="12">feedback → review rules</text>
      </g>
    </g>
  </g>
</svg>
