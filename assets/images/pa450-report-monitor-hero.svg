<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">PA450 Report CSV Monitor</title>
  <desc id="desc">A polished dark README hero for a local Windows PA450 report monitor, showing a product-style dashboard composition rather than a workflow diagram.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111f"/>
      <stop offset="0.56" stop-color="#0b1830"/>
      <stop offset="1" stop-color="#16255b"/>
    </linearGradient>
    <radialGradient id="glow-cyan" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-green" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17233d"/>
      <stop offset="1" stop-color="#081120"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.52" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="20" stdDeviation="18" flood-color="#020617" flood-opacity="0.46"/>
    </filter>
    <filter id="soft" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>

  <rect width="1200" height="520" rx="36" fill="url(#bg)"/>
  <circle cx="1014" cy="116" r="190" fill="url(#glow-cyan)" filter="url(#soft)"/>
  <circle cx="174" cy="438" r="240" fill="url(#glow-green)" filter="url(#soft)"/>
  <path d="M0 438 C155 360 312 382 464 300 C638 206 822 164 1200 194 L1200 520 L0 520 Z" fill="#ffffff" opacity="0.035"/>
  <path d="M774 80 C884 132 930 242 1076 270" stroke="#38bdf8" stroke-width="2" stroke-dasharray="7 14" opacity="0.30" fill="none"/>
  <path d="M74 344 C210 292 330 340 472 254" stroke="#22c55e" stroke-width="2" stroke-dasharray="7 14" opacity="0.22" fill="none"/>

  <g font-family="WenQuanYi Zen Hei, Microsoft JhengHei, Noto Sans TC, Segoe UI, Arial, sans-serif">
    <g transform="translate(78 72)">
      <text x="0" y="0" fill="#eaf6ff" font-size="48" font-weight="900" letter-spacing="0.2">PA450 Report CSV Monitor</text>
      <text x="2" y="43" fill="#a9c4e6" font-size="20">Windows 本機執行 · 每日 CSV · AI 分析 · Review UI 回饋記憶</text>
      <rect x="2" y="72" width="152" height="34" rx="17" fill="#0f2742" stroke="#38bdf8" opacity="0.95"/>
      <text x="78" y="94" text-anchor="middle" fill="#bae6fd" font-size="14" font-weight="700">PAN-OS XML API</text>
      <rect x="166" y="72" width="128" height="34" rx="17" fill="#102c26" stroke="#22c55e" opacity="0.95"/>
      <text x="230" y="94" text-anchor="middle" fill="#bbf7d0" font-size="14" font-weight="700">固定 CSV 欄位</text>
      <rect x="306" y="72" width="134" height="34" rx="17" fill="#261e44" stroke="#a78bfa" opacity="0.95"/>
      <text x="373" y="94" text-anchor="middle" fill="#ddd6fe" font-size="14" font-weight="700">Review Memory</text>
    </g>

    <g transform="translate(84 214)" filter="url(#shadow)">
      <rect width="408" height="214" rx="28" fill="#07111f" opacity="0.80" stroke="#27466a"/>
      <text x="34" y="46" fill="#f8fafc" font-size="22" font-weight="900">Daily report package</text>
      <text x="34" y="74" fill="#94a3b8" font-size="14">本機輸出每日檔案，方便稽核與回看</text>

      <g transform="translate(34 104)">
        <rect width="334" height="34" rx="12" fill="#102033" stroke="#1d4ed8" opacity="0.88"/>
        <text x="18" y="23" fill="#bfdbfe" font-size="14" font-weight="700">output\YYYYMMDD_report.csv</text>
        <text x="308" y="23" text-anchor="end" fill="#64748b" font-size="12">CSV</text>
      </g>
      <g transform="translate(34 148)">
        <rect width="334" height="34" rx="12" fill="#151b34" stroke="#7c3aed" opacity="0.88"/>
        <text x="18" y="23" fill="#ddd6fe" font-size="14" font-weight="700">output\report_YYYYMMDD.json</text>
        <text x="308" y="23" text-anchor="end" fill="#64748b" font-size="12">AI</text>
      </g>
    </g>

    <g transform="translate(550 142)" filter="url(#shadow)">
      <rect width="560" height="306" rx="30" fill="url(#screen)" stroke="#395575" stroke-width="1.4"/>
      <rect x="0" y="0" width="560" height="48" rx="30" fill="#0b1324" opacity="0.92"/>
      <circle cx="28" cy="24" r="6" fill="#ef4444"/>
      <circle cx="50" cy="24" r="6" fill="#f59e0b"/>
      <circle cx="72" cy="24" r="6" fill="#22c55e"/>
      <text x="104" y="30" fill="#cbd5e1" font-size="14" font-weight="700">localhost Review UI</text>

      <g transform="translate(34 78)">
        <text x="0" y="0" fill="#f8fafc" font-size="24" font-weight="900">AI report review</text>
        <text x="0" y="28" fill="#94a3b8" font-size="14">CSV 明細、AI 判讀與人工 feedback 放在同一個畫面</text>
      </g>

      <g transform="translate(34 134)">
        <rect width="300" height="122" rx="20" fill="#0f1b31" stroke="#334155"/>
        <text x="22" y="34" fill="#e2e8f0" font-size="15" font-weight="800">Top conversations</text>
        <rect x="22" y="52" width="250" height="10" rx="5" fill="#1e40af" opacity="0.72"/>
        <rect x="22" y="74" width="210" height="10" rx="5" fill="#0f766e" opacity="0.76"/>
        <rect x="22" y="96" width="138" height="10" rx="5" fill="#7c3aed" opacity="0.76"/>
      </g>

      <g transform="translate(356 134)">
        <rect width="158" height="122" rx="20" fill="#111827" stroke="#475569"/>
        <text x="22" y="35" fill="#f8fafc" font-size="28" font-weight="900">bytes</text>
        <text x="22" y="64" fill="#94a3b8" font-size="13">固定欄位包含位元組</text>
        <path d="M24 96 C54 70 78 102 108 80 C126 68 138 70 146 62" stroke="url(#accent)" stroke-width="4" fill="none" stroke-linecap="round"/>
      </g>
    </g>

    <g transform="translate(80 462)">
      <rect width="1040" height="36" rx="18" fill="#020617" opacity="0.68" stroke="#334155"/>
      <text x="520" y="24" text-anchor="middle" fill="#d8e6f7" font-size="15">PA450 custom report → 本機每日檔案；完整流程請見下方「概觀」圖</text>
    </g>
  </g>
</svg>
