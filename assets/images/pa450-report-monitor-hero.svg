<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">PA450 Report Monitor product launch hero</title>
  <desc id="desc">A product-launch style README hero with a rich stage, product dashboard mockup, traffic ribbons, and strong PA450 Report Monitor launch typography.</desc>
  <defs>
    <linearGradient id="stage" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.42" stop-color="#0f2435"/>
      <stop offset="0.72" stop-color="#173326"/>
      <stop offset="1" stop-color="#3a2309"/>
    </linearGradient>
    <radialGradient id="limeGlow" cx="70%" cy="45%" r="54%">
      <stop offset="0" stop-color="#a3e635" stop-opacity="0.42"/>
      <stop offset="0.38" stop-color="#22c55e" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="goldGlow" cx="38%" cy="70%" r="58%">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.40"/>
      <stop offset="0.35" stop-color="#f59e0b" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#172033"/><stop offset="1" stop-color="#0b1020"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.20"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/></linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22c55e"/><stop offset="0.45" stop-color="#a3e635"/><stop offset="0.78" stop-color="#facc15"/><stop offset="1" stop-color="#fb923c"/></linearGradient>
    <filter id="shadow" x="-25%" y="-35%" width="155%" height="180%"><feDropShadow dx="0" dy="28" stdDeviation="26" flood-color="#000" flood-opacity="0.46"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="12"/></filter>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.1" fill="#ffffff" opacity="0.055"/></pattern>
    <style>
      .display{font-family:'WenQuanYi Zen Hei','Arial Black',Impact,sans-serif;font-weight:900;letter-spacing:-4px;fill:#f8fafc}
      .sans{font-family:'WenQuanYi Zen Hei',Inter,Arial,sans-serif;fill:#e5e7eb}
      .mono{font-family:'JetBrains Mono',Consolas,monospace;fill:#cbd5e1}
    </style>
  </defs>
  <rect width="1200" height="520" rx="34" fill="url(#stage)"/>
  <rect width="1200" height="520" rx="34" fill="url(#limeGlow)"/>
  <rect width="1200" height="520" rx="34" fill="url(#goldGlow)"/>
  <rect width="1200" height="520" rx="34" fill="url(#dots)"/>

  <!-- launch spotlight and product device -->
  <ellipse cx="785" cy="428" rx="360" ry="54" fill="#020617" opacity="0.45" filter="url(#soft)"/>
  <g transform="translate(585 78) rotate(-2 250 180)" filter="url(#shadow)">
    <rect x="0" y="0" width="500" height="330" rx="34" fill="#0a1020" stroke="#ffffff" stroke-opacity="0.18"/>
    <rect x="22" y="24" width="456" height="282" rx="24" fill="url(#panel)" stroke="#334155"/>
    <rect x="22" y="24" width="456" height="72" rx="24" fill="url(#glass)"/>
    <text x="48" y="66" class="mono" font-size="15" font-weight="900" letter-spacing="2" fill="#a3e635">REVIEW CONSOLE</text>
    <rect x="336" y="45" width="104" height="26" rx="13" fill="#14532d" stroke="#22c55e"/>
    <text x="358" y="63" class="mono" font-size="10" font-weight="900" fill="#bbf7d0">READY</text>
    <g transform="translate(50 122)">
      <rect width="118" height="78" rx="18" fill="#111827" stroke="#334155"/>
      <text x="18" y="28" class="mono" font-size="12" fill="#94a3b8">CSV</text>
      <path d="M18 54H96" stroke="#22c55e" stroke-width="8" stroke-linecap="round"/>
      <path d="M18 68H68" stroke="#a3e635" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
      <rect x="148" width="118" height="78" rx="18" fill="#111827" stroke="#334155"/>
      <text x="166" y="28" class="mono" font-size="12" fill="#94a3b8">AI JSON</text>
      <path d="M166 54H244" stroke="#facc15" stroke-width="8" stroke-linecap="round"/>
      <path d="M166 68H221" stroke="#fb923c" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
      <rect x="296" width="118" height="78" rx="18" fill="#111827" stroke="#334155"/>
      <text x="314" y="28" class="mono" font-size="12" fill="#94a3b8">REVIEW</text>
      <path d="M314 54H392" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
      <path d="M314 68H368" stroke="#22c55e" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
    </g>
    <g transform="translate(52 238)">
      <path d="M0 0H390" stroke="#334155" stroke-width="1"/>
      <text x="0" y="32" class="mono" font-size="13" fill="#cbd5e1">report.py → analyze.py → ui.py → review memory</text>
    </g>
  </g>

  <!-- energetic launch ribbons -->
  <g fill="none" stroke-linecap="round">
    <path d="M48 430 C205 326, 302 388, 438 292 C584 191, 746 178, 1128 122" stroke="url(#flow)" stroke-width="18" opacity="0.76"/>
    <path d="M95 462 C245 384, 385 430, 544 329 C707 226, 861 256, 1140 218" stroke="#38bdf8" stroke-width="5" opacity="0.42"/>
    <path d="M55 308 C224 242, 370 289, 510 211 C628 144, 752 142, 1002 79" stroke="#a3e635" stroke-width="4" opacity="0.46"/>
  </g>
  <g fill="#f8fafc" opacity="0.9">
    <circle cx="438" cy="282" r="7"/><circle cx="584" cy="181" r="5"/><circle cx="746" cy="178" r="6"/><circle cx="1002" cy="79" r="4"/>
  </g>

  <!-- launch copy -->
  <g transform="translate(70 74)">
    <rect x="0" y="0" width="178" height="34" rx="17" fill="#ffffff" fill-opacity="0.10" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="18" y="23" class="mono" font-size="12" font-weight="900" letter-spacing="2" fill="#bef264">PRODUCT LAUNCH</text>
    <text x="0" y="106" class="display" font-size="82">PA450</text>
    <text x="0" y="188" class="display" font-size="75">REPORT</text>
    <text x="4" y="244" class="display" font-size="50" letter-spacing="2">MONITOR</text>
    <text x="6" y="290" class="sans" font-size="24" font-weight="800">From custom report to reviewed action.</text>
    <text x="7" y="322" class="mono" font-size="13" letter-spacing="1.4" fill="#cbd5e1">PAN-OS XML API · LOCAL CSV · AI ANALYSIS · HUMAN REVIEW</text>
  </g>
  <rect x="20" y="20" width="1160" height="480" rx="28" fill="none" stroke="#ffffff" stroke-opacity="0.11"/>
</svg>
