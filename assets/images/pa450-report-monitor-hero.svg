<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">PA450 Report CSV Monitor</title>
  <desc id="desc">A polished dark README hero showing PA450 report download, CSV output, AI analysis, Review UI, and review memory feedback loop.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.52" stop-color="#0b1b34"/>
      <stop offset="1" stop-color="#15245a"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17243d"/>
      <stop offset="1" stop-color="#0d1729"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020617" flood-opacity="0.42"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>

  <rect width="1200" height="520" rx="36" fill="url(#bg)"/>
  <circle cx="1018" cy="94" r="168" fill="#38bdf8" opacity="0.12" filter="url(#soft)"/>
  <circle cx="134" cy="432" r="220" fill="#22c55e" opacity="0.10" filter="url(#soft)"/>
  <path d="M0 420 C180 335 294 360 420 258 C555 150 728 132 1200 170 L1200 520 L0 520 Z" fill="#ffffff" opacity="0.035"/>

  <g font-family="WenQuanYi Zen Hei, Microsoft JhengHei, Noto Sans TC, Segoe UI, Arial, sans-serif">
    <text x="78" y="96" fill="#eaf6ff" font-size="46" font-weight="900" letter-spacing="0.2">PA450 Report CSV Monitor</text>
    <text x="80" y="137" fill="#a9c4e6" font-size="20">Windows 本機執行 · PA450 custom report 下載 · AI 分析 · Review UI 回饋記憶</text>

    <g transform="translate(80 182)" filter="url(#shadow)">
      <rect width="1040" height="205" rx="28" fill="#07111f" opacity="0.70" stroke="#27466a"/>
      <rect x="24" y="26" width="180" height="116" rx="20" fill="url(#card)" stroke="#38bdf8" stroke-width="2"/>
      <rect x="294" y="26" width="180" height="116" rx="20" fill="url(#card)" stroke="#22c55e" stroke-width="2"/>
      <rect x="564" y="26" width="180" height="116" rx="20" fill="url(#card)" stroke="#a78bfa" stroke-width="2"/>
      <rect x="834" y="26" width="180" height="116" rx="20" fill="url(#card)" stroke="#f59e0b" stroke-width="2"/>

      <g stroke="url(#accent)" stroke-width="5" fill="none" stroke-linecap="round">
        <path d="M216 84 H282"/>
        <path d="M486 84 H552"/>
        <path d="M756 84 H822"/>
      </g>
      <g fill="url(#accent)">
        <path d="M275 72 L296 84 L275 96 Z"/>
        <path d="M545 72 L566 84 L545 96 Z"/>
        <path d="M815 72 L836 84 L815 96 Z"/>
      </g>

      <text x="114" y="64" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="800">PA450 API</text>
      <text x="114" y="94" text-anchor="middle" fill="#93c5fd" font-size="15">Custom Report XML</text>
      <text x="114" y="120" text-anchor="middle" fill="#94a3b8" font-size="13">PAN-OS XML API</text>

      <text x="384" y="64" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="800">CSV Output</text>
      <text x="384" y="94" text-anchor="middle" fill="#86efac" font-size="15">YYYYMMDD_report.csv</text>
      <text x="384" y="120" text-anchor="middle" fill="#94a3b8" font-size="13">固定欄位，含位元組</text>

      <text x="654" y="64" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="800">AI Analysis</text>
      <text x="654" y="94" text-anchor="middle" fill="#c4b5fd" font-size="15">report_YYYYMMDD.json</text>
      <text x="654" y="120" text-anchor="middle" fill="#94a3b8" font-size="13">套用 review rules</text>

      <text x="924" y="64" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="800">Review UI</text>
      <text x="924" y="94" text-anchor="middle" fill="#fcd34d" font-size="15">CSV / AI / Feedback</text>
      <text x="924" y="120" text-anchor="middle" fill="#94a3b8" font-size="13">report_YYYYMMDD.md</text>

      <path d="M924 150 C924 180 718 180 654 150 C594 178 420 178 384 150" stroke="#22c55e" stroke-width="3" fill="none" stroke-dasharray="8 8" opacity="0.82"/>
      <text x="654" y="184" text-anchor="middle" fill="#cbd5e1" font-size="15">feedback 會在下一次分析前萃取成 .agent/review.md 長期規則</text>
    </g>

    <g transform="translate(80 414)">
      <rect width="1040" height="56" rx="18" fill="#020617" opacity="0.72" stroke="#334155"/>
      <text x="520" y="35" text-anchor="middle" fill="#d8e6f7" font-size="17">PowerShell quick start · Localhost Review UI · Daily CSV / JSON / Markdown feedback files</text>
    </g>
  </g>
</svg>
