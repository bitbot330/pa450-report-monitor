<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">PA450 Report Monitor refined product launch hero</title>
  <desc id="desc">A refined product launch README hero with editorial typography, split keynote stage, product console, and report-to-review motion ribbons.</desc>
  <defs>
    <linearGradient id="cream" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff7ed"/><stop offset="1" stop-color="#f3ead7"/></linearGradient>
    <linearGradient id="stage" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#061417"/><stop offset="0.62" stop-color="#0d2d24"/><stop offset="1" stop-color="#26330d"/></linearGradient>
    <radialGradient id="spot" cx="76%" cy="24%" r="58%"><stop offset="0" stop-color="#bef264" stop-opacity="0.45"/><stop offset="0.5" stop-color="#facc15" stop-opacity="0.16"/><stop offset="1" stop-color="#facc15" stop-opacity="0"/></radialGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#16a34a"/><stop offset="0.45" stop-color="#a3e635"/><stop offset="0.75" stop-color="#f59e0b"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="0.62" stop-color="#111827"/><stop offset="1" stop-color="#14532d"/></linearGradient>
    <filter id="shadow" x="-25%" y="-30%" width="150%" height="170%"><feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#020617" flood-opacity="0.28"/></filter>
    <pattern id="grain" width="38" height="38" patternUnits="userSpaceOnUse"><circle cx="7" cy="9" r="0.7" fill="#111827" opacity="0.05"/><circle cx="29" cy="21" r="0.55" fill="#111827" opacity="0.035"/></pattern>
    <style>
      .display{font-family:'WenQuanYi Zen Hei','Arial Black',Impact,sans-serif;font-weight:900;fill:#111827;letter-spacing:-4px}
      .sans{font-family:'WenQuanYi Zen Hei',Inter,Arial,sans-serif;fill:#1f2937}
      .mono{font-family:'JetBrains Mono',Consolas,monospace;fill:#334155}
    </style>
  </defs>
  <rect width="1200" height="520" rx="34" fill="url(#cream)"/>
  <rect width="1200" height="520" rx="34" fill="url(#grain)"/>
  <path d="M522 0H1200V520H458C548 382 566 166 522 0Z" fill="url(#stage)"/>
  <path d="M522 0H1200V520H458C548 382 566 166 522 0Z" fill="url(#spot)"/>
  <text x="-20" y="500" class="display" font-size="258" opacity="0.04">450</text>

