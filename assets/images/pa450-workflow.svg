<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">PA450 automation workflow</title>
  <desc id="desc">A README workflow diagram using a large feedback loop to show PA450 report download, CSV evidence, AI analysis, Review UI, feedback markdown, and reusable review memory.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030712"/>
      <stop offset="0.52" stop-color="#082f49"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#10243d"/><stop offset="1" stop-color="#07111f"/></linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38bdf8"/><stop offset="0.5" stop-color="#22c55e"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
    <linearGradient id="loop" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#f97316"/><stop offset="0.48" stop-color="#14b8a6"/><stop offset="1" stop-color="#22c55e"/></linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#7dd3fc" stroke-opacity="0.10"/></pattern>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L14,7 L0,14 Z" fill="#38bdf8"/></marker>
    <marker id="arrowLoop" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L14,7 L0,14 Z" fill="#14b8a6"/></marker>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="15" flood-color="#020617" flood-opacity="0.52"/></filter>
  </defs>
  <rect width="1100" height="620" rx="30" fill="url(#bg)"/>
  <rect x="28" y="28" width="1044" height="564" rx="24" fill="url(#grid)"/>

  <g font-family="WenQuanYi Zen Hei, Microsoft JhengHei, Noto Sans TC, Segoe UI, Arial, sans-serif">
    <text x="550" y="58" text-anchor="middle" fill="#f8fafc" font-size="36" font-weight="900">PA450 Report → Evidence → Review Memory</text>
    <text x="550" y="88" text-anchor="middle" fill="#a9bad0" font-size="16">主流程保留每日 CSV / AI JSON；人工回饋會回流成下一次分析的 review rules</text>

    <path d="M170 342 C168 494 344 540 550 540 C758 540 934 494 932 342" fill="none" stroke="url(#loop)" stroke-width="18" stroke-linecap="round" opacity="0.26"/>
    <path d="M932 342 C930 493 756 520 550 520 C346 520 172 493 170 342" fill="none" stroke="url(#loop)" stroke-width="5" stroke-linecap="round" marker-end="url(#arrowLoop)" opacity="0.95"/>
    <text x="550" y="566" text-anchor="middle" fill="#bbf7d0" font-size="15" font-weight="900">Feedback loop: report_YYYYMMDD.md → .agent/review.md → next analyze.py run</text>

    <g filter="url(#shadow)">
      <g transform="translate(70 148)">
        <rect width="185" height="132" rx="24" fill="url(#panel)" stroke="#22c55e" stroke-width="2.5"/>
        <text x="24" y="35" fill="#dcfce7" font-size="13" font-weight="900" letter-spacing="1.2">01 ACQUIRE</text>
        <text x="92" y="70" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="900">PA450 API</text>
        <text x="92" y="98" text-anchor="middle" fill="#a9bad0" font-size="14">Custom Report XML</text>
        <text x="92" y="119" text-anchor="middle" fill="#64748b" font-size="12">PAN-OS XML API</text>
      </g>
      <g transform="translate(305 148)">
        <rect width="185" height="132" rx="24" fill="url(#panel)" stroke="#38bdf8" stroke-width="2.5"/>
        <text x="24" y="35" fill="#bae6fd" font-size="13" font-weight="900" letter-spacing="1.2">02 NORMALIZE</text>
        <text x="92" y="70" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="900">report.py</text>
        <text x="92" y="98" text-anchor="middle" fill="#a9bad0" font-size="14">轉成每日 CSV</text>
        <text x="92" y="119" text-anchor="middle" fill="#64748b" font-size="12">YYYYMMDD_report.csv</text>
      </g>
      <g transform="translate(540 148)">
        <rect width="185" height="132" rx="24" fill="url(#panel)" stroke="#a78bfa" stroke-width="2.5"/>
        <text x="24" y="35" fill="#ddd6fe" font-size="13" font-weight="900" letter-spacing="1.2">03 ANALYZE</text>
        <text x="92" y="70" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="900">analyze.py</text>
        <text x="92" y="98" text-anchor="middle" fill="#a9bad0" font-size="14">讀 rules + AI</text>
        <text x="92" y="119" text-anchor="middle" fill="#64748b" font-size="12">report_YYYYMMDD.json</text>
      </g>
      <g transform="translate(775 148)">
        <rect width="255" height="132" rx="24" fill="url(#panel)" stroke="#f97316" stroke-width="2.5"/>
        <text x="24" y="35" fill="#fed7aa" font-size="13" font-weight="900" letter-spacing="1.2">04 REVIEW</text>
        <text x="128" y="70" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="900">Local Review UI</text>
        <text x="128" y="98" text-anchor="middle" fill="#a9bad0" font-size="14">檢視 CSV / AI / 單筆明細</text>
        <text x="128" y="119" text-anchor="middle" fill="#64748b" font-size="12">寫入人工回饋</text>
      </g>
    </g>

    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M255 214 H302" stroke="url(#hot)" stroke-width="7" marker-end="url(#arrow)"/>
      <path d="M490 214 H537" stroke="url(#hot)" stroke-width="7" marker-end="url(#arrow)"/>
      <path d="M725 214 H772" stroke="url(#hot)" stroke-width="7" marker-end="url(#arrow)"/>
    </g>

    <g transform="translate(94 344)" filter="url(#shadow)">
      <rect width="228" height="92" rx="22" fill="#06111f" stroke="#38bdf8"/>
      <text x="24" y="35" fill="#e0f2fe" font-size="17" font-weight="900">CSV 欄位證據</text>
      <text x="24" y="62" fill="#a9bad0" font-size="13">產生時間 · 來源 · 目的地 · 應用程式 · 位元組</text>
    </g>
    <g transform="translate(436 344)" filter="url(#shadow)">
      <rect width="228" height="92" rx="22" fill="#06111f" stroke="#14b8a6"/>
      <text x="24" y="35" fill="#ccfbf1" font-size="17" font-weight="900">Feedback Markdown</text>
      <text x="24" y="62" fill="#a9bad0" font-size="13">report_YYYYMMDD.md</text>
    </g>
    <g transform="translate(778 344)" filter="url(#shadow)">
      <rect width="228" height="92" rx="22" fill="#06111f" stroke="#22c55e"/>
      <text x="24" y="35" fill="#dcfce7" font-size="17" font-weight="900">Reusable Rules</text>
      <text x="24" y="62" fill="#a9bad0" font-size="13">.agent/review.md</text>
    </g>
  </g>
</svg>
