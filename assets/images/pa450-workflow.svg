<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">PA450 automation workflow</title>
  <desc id="desc">Technical schematic workflow for PA450 report download, CSV output, AI analysis, Review UI feedback, and review memory rules.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111f"/>
      <stop offset="0.55" stop-color="#0b1a34"/>
      <stop offset="1" stop-color="#12224a"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#7dd3fc" stroke-width="0.7" opacity="0.12"/>
    </pattern>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#172640"/>
      <stop offset="1" stop-color="#0b1426"/>
    </linearGradient>
    <linearGradient id="primary-flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.58" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="feedback-flow" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="0.45" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <marker id="arrow-primary" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 Z" fill="#60a5fa"/>
    </marker>
    <marker id="arrow-feedback" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 Z" fill="#14b8a6"/>
    </marker>
    <filter id="shadow" x="-24%" y="-24%" width="148%" height="148%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#020617" flood-opacity="0.42"/>
    </filter>
  </defs>

  <rect width="1100" height="620" rx="30" fill="url(#bg)"/>
  <rect x="28" y="28" width="1044" height="564" rx="24" fill="url(#grid)" opacity="0.92"/>

  <g font-family="WenQuanYi Zen Hei, Microsoft JhengHei, Noto Sans TC, Segoe UI, Arial, sans-serif">
    <text x="550" y="58" text-anchor="middle" fill="#eaf6ff" font-size="34" font-weight="900">PA450 Daily Report Automation</text>
    <text x="550" y="88" text-anchor="middle" fill="#9fb2cc" font-size="16">主流程：下載 → CSV → AI JSON → Review UI；回饋流程：Feedback → Review Memory → 下一次分析</text>

    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M260 210 H338" stroke="url(#primary-flow)" stroke-width="5" marker-end="url(#arrow-primary)"/>
      <path d="M520 210 H598" stroke="url(#primary-flow)" stroke-width="5" marker-end="url(#arrow-primary)"/>
      <path d="M780 210 H858" stroke="url(#primary-flow)" stroke-width="5" marker-end="url(#arrow-primary)"/>
      <path d="M946 288 V328 Q946 350 924 350 H817" stroke="url(#primary-flow)" stroke-width="5" marker-end="url(#arrow-primary)"/>

      <path d="M596 411 H522" stroke="url(#feedback-flow)" stroke-width="5" marker-end="url(#arrow-feedback)"/>
      <path d="M338 411 H264" stroke="url(#feedback-flow)" stroke-width="5" marker-end="url(#arrow-feedback)"/>
      <path d="M170 350 V311 Q170 286 195 286 H697 Q722 286 722 263" stroke="url(#feedback-flow)" stroke-width="5" marker-end="url(#arrow-feedback)"/>
    </g>

    <g opacity="0.9" font-size="12" font-weight="800" letter-spacing="1.1">
      <text x="88" y="126" fill="#7dd3fc">ACQUIRE</text>
      <text x="354" y="126" fill="#86efac">NORMALIZE</text>
      <text x="622" y="126" fill="#c4b5fd">ANALYZE</text>
      <text x="882" y="126" fill="#fcd34d">RESULT</text>
      <text x="624" y="326" fill="#fdba74">REVIEW</text>
      <text x="355" y="326" fill="#5eead4">FEEDBACK</text>
      <text x="90" y="326" fill="#cbd5e1">MEMORY</text>
    </g>

    <g filter="url(#shadow)">
      <g transform="translate(76 144)">
        <rect width="184" height="132" rx="22" fill="url(#panel)" stroke="#38bdf8" stroke-width="1.8"/>
        <circle cx="30" cy="32" r="16" fill="#0f2742" stroke="#38bdf8"/>
        <text x="30" y="38" text-anchor="middle" fill="#bae6fd" font-size="15" font-weight="900">1</text>
        <text x="112" y="43" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="900">PA450 API</text>
        <text x="92" y="78" text-anchor="middle" fill="#9fb2cc" font-size="14">Custom Report XML</text>
        <text x="92" y="104" text-anchor="middle" fill="#64748b" font-size="12">PAN-OS XML API</text>
      </g>

      <g transform="translate(336 144)">
        <rect width="184" height="132" rx="22" fill="url(#panel)" stroke="#22c55e" stroke-width="1.8"/>
        <circle cx="30" cy="32" r="16" fill="#102c26" stroke="#22c55e"/>
        <text x="30" y="38" text-anchor="middle" fill="#bbf7d0" font-size="15" font-weight="900">2</text>
        <text x="112" y="43" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="900">report.py</text>
        <text x="92" y="78" text-anchor="middle" fill="#9fb2cc" font-size="14">下載並轉成 CSV</text>
        <text x="92" y="104" text-anchor="middle" fill="#64748b" font-size="12">YYYYMMDD_report.csv</text>
      </g>

      <g transform="translate(596 144)">
        <rect width="184" height="132" rx="22" fill="url(#panel)" stroke="#a78bfa" stroke-width="1.8"/>
        <circle cx="30" cy="32" r="16" fill="#261e44" stroke="#a78bfa"/>
        <text x="30" y="38" text-anchor="middle" fill="#ddd6fe" font-size="15" font-weight="900">3</text>
        <text x="112" y="43" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="900">analyze.py</text>
        <text x="92" y="78" text-anchor="middle" fill="#9fb2cc" font-size="14">讀 review rules + AI</text>
        <text x="92" y="104" text-anchor="middle" fill="#64748b" font-size="12">產生分析結果</text>
      </g>

      <g transform="translate(856 144)">
        <rect width="184" height="132" rx="22" fill="url(#panel)" stroke="#f59e0b" stroke-width="1.8"/>
        <circle cx="30" cy="32" r="16" fill="#3b250b" stroke="#f59e0b"/>
        <text x="30" y="38" text-anchor="middle" fill="#fde68a" font-size="15" font-weight="900">4</text>
        <text x="112" y="43" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="900">AI JSON</text>
        <text x="92" y="78" text-anchor="middle" fill="#9fb2cc" font-size="14">report_YYYYMMDD.json</text>
        <text x="92" y="104" text-anchor="middle" fill="#64748b" font-size="12">AI 分析結果</text>
      </g>

      <g transform="translate(596 344)">
        <rect width="220" height="132" rx="22" fill="url(#panel)" stroke="#f97316" stroke-width="1.8"/>
        <circle cx="34" cy="34" r="16" fill="#3b1f12" stroke="#f97316"/>
        <text x="34" y="40" text-anchor="middle" fill="#fed7aa" font-size="15" font-weight="900">5</text>
        <text x="116" y="45" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="900">Review UI</text>
        <text x="116" y="82" text-anchor="middle" fill="#9fb2cc" font-size="14">檢視 CSV / AI / 明細</text>
        <text x="116" y="108" text-anchor="middle" fill="#64748b" font-size="12">寫入單筆回報</text>
      </g>

      <g transform="translate(336 344)">
        <rect width="184" height="132" rx="22" fill="url(#panel)" stroke="#14b8a6" stroke-width="1.8"/>
        <circle cx="30" cy="34" r="16" fill="#0f2f2d" stroke="#14b8a6"/>
        <text x="30" y="40" text-anchor="middle" fill="#99f6e4" font-size="15" font-weight="900">6</text>
        <text x="112" y="45" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="900">Feedback</text>
        <text x="92" y="82" text-anchor="middle" fill="#9fb2cc" font-size="14">report_YYYYMMDD.md</text>
        <text x="92" y="108" text-anchor="middle" fill="#64748b" font-size="12">人工備註與判斷</text>
      </g>

      <g transform="translate(76 344)">
        <rect width="184" height="132" rx="22" fill="url(#panel)" stroke="#94a3b8" stroke-width="1.8"/>
        <circle cx="30" cy="34" r="16" fill="#1e293b" stroke="#94a3b8"/>
        <text x="30" y="40" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="900">7</text>
        <text x="116" y="45" text-anchor="middle" fill="#f8fafc" font-size="16" font-weight="900">Review Memory</text>
        <text x="92" y="82" text-anchor="middle" fill="#9fb2cc" font-size="14">.agent/review.md</text>
        <text x="92" y="108" text-anchor="middle" fill="#64748b" font-size="12">下一次分析套用</text>
      </g>
    </g>

    <g transform="translate(98 520)">
      <rect width="904" height="58" rx="18" fill="#020617" opacity="0.72" stroke="#334155"/>
      <text x="452" y="25" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="800">CSV 固定欄位</text>
      <text x="452" y="47" text-anchor="middle" fill="#aebfd6" font-size="14">產生時間、來源位址、來源使用者、目的地位址、目的地國家、應用程式、位元組</text>
    </g>
  </g>
</svg>
