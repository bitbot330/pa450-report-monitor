<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">PA450 Report Monitor product launch workflow</title>
  <desc id="desc">A launch-slide style workflow graphic showing the product story from PA450 data collection to AI analysis, review console, and feedback memory.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="0.55" stop-color="#0d1f2e"/><stop offset="1" stop-color="#13251a"/></linearGradient>
    <radialGradient id="glow" cx="72%" cy="30%" r="58%"><stop offset="0" stop-color="#a3e635" stop-opacity="0.22"/><stop offset="1" stop-color="#a3e635" stop-opacity="0"/></radialGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22c55e"/><stop offset="0.5" stop-color="#facc15"/><stop offset="1" stop-color="#fb923c"/></linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="145%" height="165%"><feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000" flood-opacity="0.30"/></filter>
    <marker id="arrow" markerWidth="15" markerHeight="15" refX="14" refY="7.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L15,7.5 L0,15 Z" fill="#facc15"/></marker>
    <marker id="arrowGreen" markerWidth="15" markerHeight="15" refX="14" refY="7.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L15,7.5 L0,15 Z" fill="#22c55e"/></marker>
    <style>
      .title{font-family:'WenQuanYi Zen Hei','Noto Sans CJK TC','Microsoft JhengHei',Inter,sans-serif;font-weight:900;fill:#f8fafc}
      .text{font-family:'WenQuanYi Zen Hei','Noto Sans CJK TC','Microsoft JhengHei',Inter,sans-serif;fill:#cbd5e1}
      .dark{font-family:'WenQuanYi Zen Hei','Noto Sans CJK TC','Microsoft JhengHei',Inter,sans-serif;fill:#0f172a;font-weight:900}
      .mono{font-family:'JetBrains Mono',Consolas,monospace;fill:#cbd5e1}
      .label{font-family:'JetBrains Mono',Consolas,monospace;font-weight:900;letter-spacing:1.2px}
    </style>
  </defs>
  <rect width="1100" height="620" rx="30" fill="url(#bg)"/>
  <rect width="1100" height="620" rx="30" fill="url(#glow)"/>
  <text x="58" y="62" class="title" font-size="34">Product Flow: PA450 Report Monitor</text>
  <text x="58" y="94" class="text" font-size="16">把 PA450 自訂報告變成可審查、可回饋、下一次會更準的監控流程。</text>

  <path d="M102 247 C270 130, 430 130, 548 247 S818 365, 998 247" fill="none" stroke="url(#flow)" stroke-width="18" opacity="0.78" marker-end="url(#arrow)"/>
  <path d="M105 247 C270 130, 430 130, 548 247 S818 365, 998 247" fill="none" stroke="#fff" stroke-width="2" opacity="0.35"/>

  <g filter="url(#shadow)">
    <g transform="translate(54 168)">
      <rect width="206" height="150" rx="28" fill="#f8fafc"/>
      <circle cx="48" cy="46" r="25" fill="#14532d"/><text x="39" y="55" class="label" font-size="23" fill="#f8fafc">1</text>
      <text x="86" y="42" class="label" font-size="12" fill="#14532d">CONNECT</text>
      <text x="28" y="88" class="dark" font-size="23">設定 PA450</text>
      <text x="28" y="119" class="mono" font-size="13" style="fill:#475569">config.yaml + .env</text>
    </g>
    <g transform="translate(301 106)">
      <rect width="206" height="150" rx="28" fill="#f8fafc"/>
      <circle cx="48" cy="46" r="25" fill="#166534"/><text x="39" y="55" class="label" font-size="23" fill="#f8fafc">2</text>
      <text x="86" y="42" class="label" font-size="12" fill="#166534">COLLECT</text>
      <text x="28" y="88" class="dark" font-size="23">下載報表</text>
      <text x="28" y="119" class="mono" font-size="13" style="fill:#475569">src/report.py → CSV</text>
    </g>
    <g transform="translate(550 278)">
      <rect width="206" height="150" rx="28" fill="#fff7ed"/>
      <circle cx="48" cy="46" r="25" fill="#b45309"/><text x="39" y="55" class="label" font-size="23" fill="#f8fafc">3</text>
      <text x="86" y="42" class="label" font-size="12" fill="#b45309">ANALYZE</text>
      <text x="28" y="88" class="dark" font-size="23">AI 分析</text>
      <text x="28" y="119" class="mono" font-size="13" style="fill:#475569">src/analyze.py → JSON</text>
    </g>
    <g transform="translate(810 168)">
      <rect width="206" height="150" rx="28" fill="#f8fafc"/>
      <circle cx="48" cy="46" r="25" fill="#0f766e"/><text x="39" y="55" class="label" font-size="23" fill="#f8fafc">4</text>
      <text x="86" y="42" class="label" font-size="12" fill="#0f766e">REVIEW</text>
      <text x="28" y="88" class="dark" font-size="23">人工審查</text>
      <text x="28" y="119" class="mono" font-size="13" style="fill:#475569">src/ui.py</text>
    </g>
  </g>

  <g transform="translate(72 458)">
    <rect width="956" height="92" rx="28" fill="#ffffff" fill-opacity="0.10" stroke="#ffffff" stroke-opacity="0.16"/>
    <text x="30" y="35" class="label" font-size="13" fill="#bef264">OUTPUTS + FEEDBACK MEMORY</text>
    <text x="30" y="64" class="mono" font-size="14">output/YYYYMMDD_report.csv → output/report_YYYYMMDD.json → report_YYYYMMDD.md → .agent/review.md</text>
    <path d="M743 24 C826 -20, 932 12, 936 86" fill="none" stroke="#22c55e" stroke-width="5" stroke-dasharray="10 8" marker-end="url(#arrowGreen)"/>
    <text x="758" y="31" class="label" font-size="12" fill="#86efac">NEXT RUN READS RULES</text>
  </g>
  <rect x="20" y="20" width="1060" height="580" rx="26" fill="none" stroke="#ffffff" stroke-opacity="0.10"/>
</svg>
