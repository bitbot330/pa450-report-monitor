<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">PA450 Report Monitor workflow map</title>
  <desc id="desc">A clear left-to-right workflow map: configure, download CSV, analyze with review rules, inspect in Review UI, then feedback returns to review memory for the next run.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="1" stop-color="#ece2ce"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#16201d" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-16%" y="-20%" width="132%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="13" flood-color="#16201d" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L15,8 L1,15 Z" fill="#17201d"/>
    </marker>
    <marker id="arrowAmber" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L15,8 L1,15 Z" fill="#d97706"/>
    </marker>
    <style>
      .sans{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#17201d}
      .mono{font-family:"JetBrains Mono","Cascadia Mono","SFMono-Regular",Consolas,monospace;fill:#17201d}
      .label{font-family:"JetBrains Mono","Cascadia Mono",Consolas,monospace;font-size:12px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;fill:#766a53}
      .body{font-family:Inter,Segoe UI,Arial,"WenQuanYi Zen Hei",sans-serif;font-size:16px;fill:#475247}
    </style>
  </defs>

  <rect width="1100" height="620" rx="34" fill="url(#paper)"/>
  <rect width="1100" height="620" rx="34" fill="url(#grid)"/>

  <g transform="translate(54 44)">
    <text x="0" y="24" class="label">PA450 REPORT MONITOR / RUN ORDER</text>
    <text x="0" y="72" class="sans" font-size="42" font-weight="900" letter-spacing="-1.5">Report → CSV → AI JSON → Review</text>
    <text x="0" y="108" class="body">Run left to right. The lower return lane carries Review UI feedback into the next analysis.</text>
  </g>

  <!-- primary track -->
  <path d="M112 272H984" stroke="#17201d" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M112 272H984" stroke="#fffaf0" stroke-width="2" stroke-linecap="round" opacity="0.72"/>

  <!-- steps -->
  <g filter="url(#shadow)">
    <g transform="translate(72 178)">
      <rect width="206" height="188" rx="22" fill="#fffdf7" stroke="#17201d" stroke-opacity="0.18"/>
      <circle cx="35" cy="34" r="18" fill="#17201d"/><text x="35" y="40" text-anchor="middle" class="mono" font-size="15" font-weight="900" fill="#fffaf0">1</text>
      <text x="64" y="40" class="label">SETUP</text>
      <text x="28" y="82" class="sans" font-size="24" font-weight="850">config + .env</text>
      <text x="28" y="115" class="body">PA450 host / auth</text>
      <text x="28" y="142" class="body">custom report name</text>
      <rect x="28" y="158" width="130" height="10" rx="5" fill="#e9dcc3"/>
    </g>

    <g transform="translate(326 178)">
      <rect width="206" height="188" rx="22" fill="#fffdf7" stroke="#17201d" stroke-opacity="0.18"/>
      <circle cx="35" cy="34" r="18" fill="#2f6f56"/><text x="35" y="40" text-anchor="middle" class="mono" font-size="15" font-weight="900" fill="#fffaf0">2</text>
      <text x="64" y="40" class="label">DOWNLOAD</text>
      <text x="28" y="82" class="sans" font-size="24" font-weight="850">src/report.py</text>
      <text x="28" y="115" class="body">PAN-OS XML API</text>
      <text x="28" y="142" class="body">YYYYMMDD_report.csv</text>
      <rect x="28" y="158" width="150" height="10" rx="5" fill="#cfe0d2"/>
    </g>

    <g transform="translate(580 178)">
      <rect width="206" height="188" rx="22" fill="#fffdf7" stroke="#17201d" stroke-opacity="0.18"/>
      <circle cx="35" cy="34" r="18" fill="#d97706"/><text x="35" y="40" text-anchor="middle" class="mono" font-size="15" font-weight="900" fill="#fffaf0">3</text>
      <text x="64" y="40" class="label">ANALYZE</text>
      <text x="28" y="82" class="sans" font-size="24" font-weight="850">src/analyze.py</text>
      <text x="28" y="115" class="body">read .agent/review.md</text>
      <text x="28" y="142" class="body">write AI JSON result</text>
      <rect x="28" y="158" width="116" height="10" rx="5" fill="#f1d29c"/>
    </g>

    <g transform="translate(834 178)">
      <rect width="206" height="188" rx="22" fill="#fffdf7" stroke="#17201d" stroke-opacity="0.18"/>
      <circle cx="35" cy="34" r="18" fill="#17201d"/><text x="35" y="40" text-anchor="middle" class="mono" font-size="15" font-weight="900" fill="#fffaf0">4</text>
      <text x="64" y="40" class="label">REVIEW</text>
      <text x="28" y="82" class="sans" font-size="24" font-weight="850">src/ui.py</text>
      <text x="28" y="115" class="body">inspect CSV / JSON</text>
      <text x="28" y="142" class="body">save feedback markdown</text>
      <rect x="28" y="158" width="142" height="10" rx="5" fill="#d7d0c1"/>
    </g>
  </g>

  <!-- output lane labels -->
  <g transform="translate(108 390)">
    <rect x="0" y="0" width="884" height="62" rx="18" fill="#17201d" fill-opacity="0.94"/>
    <text x="28" y="25" class="mono" font-size="13" font-weight="850" style="fill:#fffaf0">MAIN OUTPUTS</text>
    <text x="28" y="47" class="mono" font-size="13" style="fill:#f5ead7">output\YYYYMMDD_report.csv</text>
    <text x="316" y="47" class="mono" font-size="13" style="fill:#f5ead7">output\report_YYYYMMDD.json</text>
    <text x="606" y="47" class="mono" font-size="13" style="fill:#f5ead7">output\report_YYYYMMDD.md</text>
  </g>

  <!-- memory return rail -->
  <g transform="translate(196 494)">
    <path d="M738 0 C620 56 238 56 120 0" fill="none" stroke="#d97706" stroke-width="5" stroke-linecap="round" marker-end="url(#arrowAmber)"/>
    <rect x="175" y="18" width="506" height="54" rx="18" fill="#fffdf7" stroke="#d97706" stroke-opacity="0.45"/>
    <text x="428" y="40" class="mono" text-anchor="middle" font-size="13" font-weight="900" fill="#8a4d0d">FEEDBACK RETURN LANE</text>
    <text x="428" y="60" class="sans" text-anchor="middle" font-size="16" font-weight="700" fill="#4b4030">Review UI feedback → review rules → loaded before next analyze run</text>
  </g>

</svg>
