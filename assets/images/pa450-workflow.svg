<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">PA450 automation overview</title>
  <desc id="desc">Clear overview diagram showing how to run PA450 report.py, analyze.py, ui.py, and how feedback becomes review memory for the next analysis.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eaf3ff"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f8fbff"/></linearGradient>
    <marker id="arrow" markerWidth="13" markerHeight="13" refX="12" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L13,6.5 L0,13 Z" fill="#2563eb"/></marker>
    <marker id="arrowGreen" markerWidth="13" markerHeight="13" refX="12" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L13,6.5 L0,13 Z" fill="#16a34a"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.13"/></filter>
  </defs>
  <rect width="1100" height="620" rx="28" fill="url(#bg)"/>
  <g font-family="WenQuanYi Zen Hei, Microsoft JhengHei, Noto Sans TC, Segoe UI, Arial, sans-serif">
    <text x="550" y="52" text-anchor="middle" fill="#0f172a" font-size="34" font-weight="900">PA450 Report Monitor 概觀流程</text>
    <text x="550" y="82" text-anchor="middle" fill="#475569" font-size="15">照順序跑：下載報表 → 產生 CSV → AI 分析 → 開 Review UI → 回饋成下一次規則</text>

    <g filter="url(#shadow)">
      <g transform="translate(60 132)">
        <rect width="190" height="132" rx="20" fill="url(#card)" stroke="#38bdf8" stroke-width="2"/>
        <text x="24" y="34" fill="#0369a1" font-size="13" font-weight="900">STEP 1</text>
        <text x="95" y="68" text-anchor="middle" fill="#0f172a" font-size="20" font-weight="900">PA450</text>
        <text x="95" y="96" text-anchor="middle" fill="#475569" font-size="14">Custom report</text>
        <text x="95" y="116" text-anchor="middle" fill="#64748b" font-size="12">PAN-OS XML API</text>
      </g>
      <g transform="translate(310 132)">
        <rect width="190" height="132" rx="20" fill="url(#card)" stroke="#2563eb" stroke-width="2"/>
        <text x="24" y="34" fill="#1d4ed8" font-size="13" font-weight="900">STEP 2</text>
        <text x="95" y="68" text-anchor="middle" fill="#0f172a" font-size="20" font-weight="900">src\report.py</text>
        <text x="95" y="96" text-anchor="middle" fill="#475569" font-size="14">下載 XML 並轉 CSV</text>
        <text x="95" y="116" text-anchor="middle" fill="#64748b" font-size="12">output\YYYYMMDD_report.csv</text>
      </g>
      <g transform="translate(560 132)">
        <rect width="190" height="132" rx="20" fill="url(#card)" stroke="#7c3aed" stroke-width="2"/>
        <text x="24" y="34" fill="#6d28d9" font-size="13" font-weight="900">STEP 3</text>
        <text x="95" y="68" text-anchor="middle" fill="#0f172a" font-size="20" font-weight="900">src\analyze.py</text>
        <text x="95" y="96" text-anchor="middle" fill="#475569" font-size="14">讀 CSV + review rules</text>
        <text x="95" y="116" text-anchor="middle" fill="#64748b" font-size="12">output\report_YYYYMMDD.json</text>
      </g>
      <g transform="translate(810 132)">
        <rect width="230" height="132" rx="20" fill="url(#card)" stroke="#f97316" stroke-width="2"/>
        <text x="24" y="34" fill="#c2410c" font-size="13" font-weight="900">STEP 4</text>
        <text x="115" y="68" text-anchor="middle" fill="#0f172a" font-size="20" font-weight="900">src\ui.py</text>
        <text x="115" y="96" text-anchor="middle" fill="#475569" font-size="14">Review UI 檢視 CSV / AI</text>
        <text x="115" y="116" text-anchor="middle" fill="#64748b" font-size="12">針對單筆資料寫 feedback</text>
      </g>
    </g>

    <g fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round">
      <path d="M250 198 H306" marker-end="url(#arrow)"/>
      <path d="M500 198 H556" marker-end="url(#arrow)"/>
      <path d="M750 198 H806" marker-end="url(#arrow)"/>
    </g>

    <g transform="translate(80 324)">
      <rect width="940" height="92" rx="22" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="34" y="34" fill="#0f172a" font-size="18" font-weight="900">輸入 / 輸出檔案</text>
      <text x="34" y="62" fill="#334155" font-size="14">config.yaml + .env → report.py → output\YYYYMMDD_report.csv</text>
      <text x="34" y="84" fill="#334155" font-size="14">output\YYYYMMDD_report.csv → analyze.py → output\report_YYYYMMDD.json → Review UI</text>
    </g>

    <g filter="url(#shadow)">
      <g transform="translate(180 462)">
        <rect width="240" height="86" rx="20" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
        <text x="120" y="34" text-anchor="middle" fill="#166534" font-size="18" font-weight="900">Feedback Markdown</text>
        <text x="120" y="60" text-anchor="middle" fill="#475569" font-size="13">report_YYYYMMDD.md</text>
      </g>
      <g transform="translate(680 462)">
        <rect width="240" height="86" rx="20" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
        <text x="120" y="34" text-anchor="middle" fill="#166534" font-size="18" font-weight="900">Review Memory</text>
        <text x="120" y="60" text-anchor="middle" fill="#475569" font-size="13">.agent\review.md</text>
      </g>
    </g>
    <path d="M925 264 V292 Q925 306 940 306 H1046 V452 Q1046 476 1022 476 H420" fill="none" stroke="#16a34a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowGreen)"/>
    <path d="M420 505 H676" fill="none" stroke="#16a34a" stroke-width="5" stroke-linecap="round" marker-end="url(#arrowGreen)"/>
    <path d="M800 462 V306 Q800 284 778 284 H657 Q635 284 635 264" fill="none" stroke="#16a34a" stroke-width="4" stroke-dasharray="9 8" stroke-linecap="round" marker-end="url(#arrowGreen)"/>
    <text x="550" y="590" text-anchor="middle" fill="#166534" font-size="14" font-weight="900">下一次執行 analyze.py 時會讀取 .agent\review.md 作為 review rules</text>
  </g>
</svg>
